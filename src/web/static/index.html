                        </svg>
                        <svg class="theme-icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="10" cy="10" r="3.2"/>
                            <path d="M10 2.6v2M10 15.4v2M17.4 10h-2M4.6 10h-2M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4M15.2 15.2l-1.4-1.4M6.2 6.2 4.8 4.8"/>
                        </svg>
                    </button>
                    <button class="shutdown-btn" id="shutdown-btn" onclick="shutdownDashboard()" title="Close tmux session" aria-label="Close tmux session">
                        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                            <path d="M8 1.8v5.4"/>
                            <path d="M4.2 4.2a5 5 0 1 0 7.6 0"/>
                        </svg>
                    </button>
                    <span class="conn-dot" id="conn-dot"></span>
                </div>
            </div>
        </aside>

        <div class="panel chats-view" id="main-panel">
            <div class="panel-main">
                <button class="review-toggle" id="review-toggle" type="button" onclick="toggleReviewSidebar()" title="Review">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 2.5h6l2 2V13.5H4z"/>
                        <path d="M10 2.5v2h2"/>
                        <path d="M6 7h4M6 9.5h3"/>
                    </svg>
                    <span>Review</span>
                </button>
                <div class="detail-header" id="detail-header">
                    <div class="detail-title" id="detail-title">VibeGame Dashboard</div>
                </div>
                <div class="panel-body" id="panel-body">
                    <div class="welcome">
                        <h2>VibeGame Dashboard</h2>
                        <p>Select an agent session to chat,<br>or browse Assets.</p>
                    </div>
                </div>
                <div class="panel-input" id="panel-input" style="display:none">
                    <div class="input-wrap">
                    <div class="input-card">
                        <div class="pasted-images" id="pasted-images"></div>
                        <textarea class="prompt-textarea" id="prompt-input"
                            placeholder="Send a message…"
                            rows="1"></textarea>
                        <div class="input-footer">
                            <button class="send-btn" id="send-btn" title="Send (Enter)">↑</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
            <aside class="review-sidebar" id="review-sidebar" aria-label="Review">
                <div class="review-inner">
                    <div class="review-head">
                        <div class="review-title">Review</div>
                        <button class="review-close" type="button" onclick="setReviewSidebarOpen(false)" title="Close">×</button>
                    </div>
                    <div class="review-body" id="review-body">
                        <div class="review-empty">Open review context</div>
                    </div>
                </div>
            </aside>
        </div>
        <button class="scroll-bottom" id="scroll-bottom" onclick="scrollToBottom()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="2" x2="7" y2="10"/><polyline points="3.5 7 7 10.5 10.5 7"/></svg>
            <span>New</span>
        </button>
    </div>

    <script>
        let sessions = [];
        let selectedId = null;
        let didAutoSelectDefault = false;  // auto-open orchestrator once per page load
        let selectedName = null;
        let sidebarCollapsed = localStorage.getItem('vg_sidebar') === '1';
        let ws = null;
        let wsReconnectTimer = null;
        let fallbackPollTimer = null;
        const FALLBACK_POLL_MS = 3000;
        let inputDrafts = {};
        let pastedImages = [];  // {path, objectUrl, thumbEl}
        let pendingPrompt = null;
        let interruptInFlight = false;
        let detailRequestVersion = 0;
        let detailRefreshTimers = [];
        let detailPollTimer = null;
        const renderedMessageCounts = new Map();
        let currentView = 'chats'; // 'chats' | 'assets' | 'objects' | 'play'
        let reviewSidebarOpen = false;
        let reviewPayload = null;
        // Track which stopped sessions have been viewed
        let viewedSessions = new Set(JSON.parse(localStorage.getItem('vg_viewed') || '[]'));

        const layout      = document.getElementById('layout');
        const mainPanel   = document.getElementById('main-panel');
        const sidebarBody = document.getElementById('sidebar-body');
        const panelBody   = document.getElementById('panel-body');
        const panelInput  = document.getElementById('panel-input');
        const reviewBody  = document.getElementById('review-body');
        const detailHeader = document.getElementById('detail-header');
        const detailTitle  = document.getElementById('detail-title');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn     = document.getElementById('send-btn');
        const connDot     = document.getElementById('conn-dot');
        const scrollBtn   = document.getElementById('scroll-bottom');
        const themeBtn    = document.getElementById('theme-btn');
        let wasAtBottom   = true;

        if (sidebarCollapsed) layout.classList.add('collapsed');

        // ---- Theme ----
        function applyTheme(dark) {
            if (dark) document.documentElement.dataset.theme = 'dark';
            else document.documentElement.removeAttribute('data-theme');
            if (themeBtn) {
                const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
                themeBtn.title = label;
                themeBtn.setAttribute('aria-label', label);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            const nextDark = !isDark;
            localStorage.setItem('vg_theme', nextDark ? 'dark' : 'light');
            applyTheme(nextDark);
        }

        applyTheme(document.documentElement.dataset.theme === 'dark');

        // ---- Review sidebar ----
        function setReviewSidebarOpen(open) {
            reviewSidebarOpen = !!open && currentView === 'chats';
            mainPanel.classList.toggle('review-open', reviewSidebarOpen);
            if (reviewSidebarOpen) loadReviewContext();
        }

        function toggleReviewSidebar() {
            setReviewSidebarOpen(!reviewSidebarOpen);
        }

        async function loadReviewContext() {
            reviewBody.innerHTML = '<div class="review-empty">Loading review context...</div>';
            try {
                const res = await fetch('/api/review');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                reviewPayload = await res.json();
                renderReviewSidebar();
            } catch (err) {
                reviewBody.innerHTML = `<div class="review-error">Review unavailable<br><code>${esc(err.message || err)}</code></div>`;
            }
        }

        function renderReviewSidebar() {
            const payload = reviewPayload || {};
            const lock = payload.review_lock || { state: 'unknown' };
            const state = ['open', 'locked'].includes(lock.state) ? lock.state : 'unknown';
            const stateLabel = state === 'locked' ? 'Locked' : state === 'open' ? 'Open' : 'Unknown';
            const docs = payload.docs || [];
            const lockActivity = lock.mtime ? `Lock updated ${reltime(lock.mtime)} ago` : 'No active lock file';
            const reviewActivity = lock.review_log?.mtime ? `Review log ${reltime(lock.review_log.mtime)} ago` : 'No review log activity';
            const nodes = [
                {
                    kind: 'lock',
                    title: 'review-lock',
                    status: stateLabel,
                    css: state,
                    meta: lock.review_log?.exists ? 'review.md' : reviewActivity,
                    path: lock.review_log?.preview_path || '',
                    label: 'review.md',
                    tooltip: lock.review_log?.path || lock.path || ''
                },
                ...docs.map(doc => ({
                    kind: 'doc',
                    title: doc.name,
                    status: doc.exists ? 'Markdown' : 'Missing',
                    css: doc.exists ? 'doc' : 'missing',
                    meta: doc.exists && doc.mtime ? `Updated ${reltime(doc.mtime)} ago` : doc.path,
                    path: doc.exists ? (doc.preview_path || '') : '',
                    label: doc.name,
                    tooltip: doc.path
                }))
            ];
            const nodeW = 220;
            const nodeH = 66;
            const gap = 28;
            const padX = 12;
            const padY = 10;
            const svgW = nodeW + padX * 2;
            const svgH = Math.max(150, padY * 2 + nodes.length * nodeH + Math.max(0, nodes.length - 1) * gap);
            const centerX = padX + nodeW / 2;
            const edges = nodes.slice(1).map((_, i) => {
                const y1 = padY + i * (nodeH + gap) + nodeH;
                const y2 = padY + (i + 1) * (nodeH + gap);
                return `<path class="review-edge" d="M ${centerX} ${y1} V ${y2}"/>`;
            }).join('');
            const nodeEls = nodes.map((node, i) => {
                const y = padY + i * (nodeH + gap);
                const canOpen = !!node.path;
                const click = canOpen ? `onclick="openFilePreview('${escAttr(node.path)}', '${escAttr(node.label)}')"` : '';
                const disabledAttr = canOpen ? '' : 'disabled';
                const disabled = canOpen ? '' : 'no-preview';
                return `
                    <g transform="translate(${padX}, ${y})">
                        <foreignObject width="${nodeW}" height="${nodeH}">
                            <button xmlns="http://www.w3.org/1999/xhtml"
                                type="button"
                                class="review-node-box ${escAttr(node.css)} ${disabled}"
                                ${click}
                                ${disabledAttr}
                                title="${escAttr(node.tooltip)}">
                                <div class="review-node-title">${esc(node.title)}</div>
                                <div class="review-node-status">${esc(node.status)}</div>
                                <div class="review-node-meta">${esc(node.meta || '')}</div>
                            </button>
                        </foreignObject>
                    </g>
                `;
            }).join('');

            reviewBody.innerHTML = `
                <div class="review-dag" title="${escAttr(lockActivity)}">
                    <svg class="review-svg" viewBox="0 0 ${svgW} ${svgH}" height="${svgH}" aria-label="Review board">
                        ${edges}
                        ${nodeEls}
                    </svg>
                </div>
            `;
        }

        function escAttr(str) {
            return esc(str).replace(/'/g, '&#39;');
        }

        // ---- View switching ----
        const dashboardViews = new Set(['chats', 'assets', 'objects', 'play']);

        function viewFromHash() {
            const view = location.hash.slice(1).split('?', 1)[0];
            return dashboardViews.has(view) ? view : 'chats';
        }

        function objectPathFromHash() {
            if (viewFromHash() !== 'objects') return '';
            const query = location.hash.split('?', 2)[1] || '';
            return new URLSearchParams(query).get('node') || '';
        }

        function assetPathFromHash() {
            if (viewFromHash() !== 'assets') return '';
            const query = location.hash.split('?', 2)[1] || '';
            return new URLSearchParams(query).get('asset') || '';
        }

        function setAssetPathHash(path) {
            const hash = path ? `#assets?asset=${encodeURIComponent(path)}` : '#assets';
            history.replaceState(null, '', hash);
        }

        function setObjectPathHash(path) {
            const hash = `#objects?node=${encodeURIComponent(path)}`;
            history.replaceState(null, '', hash);
        }

        function setViewHash(view) {
            if (viewFromHash() !== view || !location.hash) location.hash = view;
        }

        function switchView(view, updateHash = true) {
            if (view === currentView) return;

            // Cleanup previous view
            if (currentView === 'assets' && view !== 'assets' && window._assetEditor) {
                window._assetEditor.destroy();
            }
            if (currentView === 'objects' && view !== 'objects' && window._objectEditor) {
                window._objectEditor.destroy();
            }
            currentView = view;
            if (updateHash) setViewHash(view);
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.view === view);
            });
            mainPanel.classList.toggle('chats-view', view === 'chats');
            if (view !== 'chats') setReviewSidebarOpen(false);
            if (view === 'chats') {
                renderSidebar();
                sidebarBody.style.display = '';
                panelInput.style.display = selectedId ? '' : 'none';
                if (selectedId) loadDetail(selectedId);
                else showWelcome();
            } else if (view === 'assets') {
                hideDetailHeader();
                panelInput.style.display = 'none';
                sidebarBody.style.display = '';
                renderAssetsView();
            } else if (view === 'objects') {
                hideDetailHeader();
                panelInput.style.display = 'none';
                sidebarBody.style.display = '';
                renderObjectsView();
            } else if (view === 'play') {
                hideDetailHeader();
                sidebarBody.innerHTML = '';
                sidebarBody.style.display = '';
                panelInput.style.display = 'none';
                renderPlayView();
            }
        }

        async function renderAssetsView() {
            hideDetailHeader();
            panelBody.innerHTML = `<div style="padding:2rem;color:var(--stone);font-size:0.875rem">Loading assets...</div>`;
            sidebarBody.innerHTML = `<div style="padding:1rem;color:var(--stone);font-size:0.8rem">Loading...</div>`;
            // Wait for editor module to load (module scripts are deferred)
            function tryInit() {
                if (window._assetEditor) {
                    window._assetEditor.init(sidebarBody, panelBody, toast, {
                        initialPath: assetPathFromHash(),
                        onSelect: setAssetPathHash,
                    });
                } else {
                    setTimeout(tryInit, 50);
                }
            }
            tryInit();
        }

        async function renderObjectsView() {
            hideDetailHeader();
            panelBody.innerHTML = `<div style="padding:2rem;color:var(--stone);font-size:0.875rem">Loading objects...</div>`;
            sidebarBody.innerHTML = `<div style="padding:1rem;color:var(--stone);font-size:0.8rem">Loading...</div>`;
            function tryInit() {
                if (window._objectEditor) {
                    window._objectEditor.init(sidebarBody, panelBody, toast, {
                        initialPath: objectPathFromHash(),
                        onSelect: setObjectPathHash,
                    });
                } else {
                    setTimeout(tryInit, 50);
                }
            }
            tryInit();
        }


        // ---- Play View ----
        // The game is served by this same dashboard under /play/, so there is no
// second server to start and no port to track -- `running` is purely
// whether the user has asked to see it.
            let playState = { running: false };

        async function renderPlayView() {
            hideDetailHeader();
            renderPlayUI();
        }

        function renderPlayUI() {
            if (playState.running) {
                panelBody.innerHTML = `
                    <div class="play-view">
                        <div class="play-toolbar">
                            <span class="play-title">Game Preview</span>
                            <span class="play-port">/play/</span>
                            <button class="at-btn" style="margin-left:auto" onclick="playStop()">Stop</button>
                        </div>
                        <div class="play-iframe-wrap">
                            <iframe class="play-iframe" src="/play/" sandbox="allow-scripts allow-same-origin"></iframe>
                        </div>
                    </div>`;
            } else {
                panelBody.innerHTML = `
                    <div class="play-view">
                        <div class="play-toolbar">
                            <span class="play-title">Game Preview</span>
                            <button class="at-btn at-btn-primary" style="margin-left:auto" onclick="playStart()" >
                                Start
                            </button>
                        </div>
                        <div class="play-placeholder">
                            <div class="play-placeholder-icon">▶</div>
                            <p>Static game preview.<br>Agent uses <code>vibegame run</code> for full Runtime API testing.</p>
                        </div>
                    </div>`;
            }
        }

        async function onPlayNavClick(updateHash = true) {
            // Auto-start when entering Play tab if not running
            if (!playState.running && !playState.starting) {
                playState.starting = true;
                currentView = 'play';
                if (updateHash) setViewHash('play');
                document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === 'play'));
                mainPanel.classList.remove('chats-view', 'review-open');
                reviewSidebarOpen = false;
                sidebarBody.innerHTML = '';
                sidebarBody.style.display = '';
                panelInput.style.display = 'none';
                renderPlayUI();
                await playStart();
            } else if (currentView === 'play') {
                // Re-clicking Play while already on Play means "reload the
                // game". switchView would early-return, so call renderPlayView
                // directly — it rebuilds the iframe so its src reattaches and
                // the game reloads.
                renderPlayView();
            } else {
                switchView('play');
            }
        }

        function playStart() {
            playState.running = true;
            renderPlayUI();
        }

        function playStop() {
            playState.running = false;
            renderPlayUI();
        }


        // ---- Scroll management ----
        function positionScrollBtn() {
            const inputRect = panelInput.getBoundingClientRect();
            if (inputRect.width === 0) return; // input hidden
            scrollBtn.style.bottom = (window.innerHeight - inputRect.top + 10) + 'px';
            scrollBtn.style.left = (inputRect.left + inputRect.width / 2) + 'px';
            scrollBtn.style.transform = 'translateX(-50%)';
        }
        panelBody.addEventListener('scroll', () => {
            const atBottom = panelBody.scrollHeight - panelBody.scrollTop - panelBody.clientHeight < 40;
            wasAtBottom = atBottom;
            scrollBtn.classList.toggle('visible', !atBottom);
            if (!atBottom) positionScrollBtn();
        });
        function scrollToBottom() {
            panelBody.scrollTop = panelBody.scrollHeight;
            wasAtBottom = true;
            scrollBtn.classList.remove('visible');
        }

        // ---- Sidebar toggle ----
        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            layout.classList.toggle('collapsed', sidebarCollapsed);
            localStorage.setItem('vg_sidebar', sidebarCollapsed ? '1' : '0');
        }

        // ---- WebSocket ----
        function setConnectionMode(mode) {
            connDot.classList.toggle('live', mode === 'websocket');
            connDot.classList.toggle('polling', mode === 'polling');
            connDot.title = mode === 'websocket'
                ? 'Live updates connected'
                : mode === 'polling'
                    ? 'Connected via polling'
                    : 'Disconnected';
        }

        async function pollFallback() {
            const sessionsOk = await fetchSessions();
            await fetchPendingPermissions();
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                setConnectionMode(sessionsOk ? 'polling' : 'offline');
            }
        }

        function startPollingFallback() {
            if (fallbackPollTimer) return;
            pollFallback();
            fallbackPollTimer = setInterval(pollFallback, FALLBACK_POLL_MS);
        }

        function stopPollingFallback() {
            if (!fallbackPollTimer) return;
            clearInterval(fallbackPollTimer);
            fallbackPollTimer = null;
        }

        async function connectWebSocket() {
            if (ws && [WebSocket.CONNECTING, WebSocket.OPEN].includes(ws.readyState)) return;
            try {
                const r = await fetch('/status');
                if (r.ok) {
                    const s = await r.json();
                    if (s.project) document.title = `${s.project} - VibeGame Dashboard`;
                }
            } catch (error) {
                console.warn('Unable to read /status', error);
            }
            // Same origin as the page: host includes the port actually in use, so
            // this stays correct behind port mappings, tunnels and proxies.
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl  = `${wsProtocol}//${window.location.host}/stream`;
            try {
                ws = new WebSocket(wsUrl);
                ws.onopen    = () => {
                    if (wsReconnectTimer) {
                        clearTimeout(wsReconnectTimer);
                        wsReconnectTimer = null;
                    }
                    stopPollingFallback();
                    setConnectionMode('websocket');
                };
                ws.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (msg.type === 'initial') {
                            sessions = msg.data || [];
                            onSessionsUpdated();
                        } else if (msg.type === 'permission_request') {
                            handlePermissionRequest(msg.data);
                        } else if (msg.type === 'permission_resolved') {
                            // already handled by decide button; ignore
                        } else if (msg.type === 'context_update') {
                            // Light update — patch in place without a full /sessions refetch.
                            const id = msg.data?.id;
                            const pct = msg.data?.context_pct;
                            if (id && pct !== undefined) {
                                const s = sessions.find(x => x.id === id);
                                if (s) {
                                    s.context_pct = pct;
                                    s.context_updated_at = msg.data?.context_updated_at;
                                    if (currentView === 'chats') renderSidebar();
                                }
                            }
                        } else if (['event','session_deleted','sessions_cleared'].includes(msg.type)) {
                            if (msg.type === 'session_deleted' && msg.data?.id === selectedId) {
                                selectedId = null;
                                if (currentView === 'chats') showWelcome();
                            }
                            fetchSessions();
                            if (msg.type === 'event' && msg.data?.session_id === selectedId) {
                                scheduleDetailRefresh(selectedId);
                            }
                        }
                    } catch {}
                };
                ws.onclose = () => {
                    setConnectionMode('offline');
                    startPollingFallback();
                    if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                    wsReconnectTimer = setTimeout(connectWebSocket, 3000);
                };
                ws.onerror = () => ws.close();
            } catch {
                startPollingFallback();
                if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                wsReconnectTimer = setTimeout(connectWebSocket, 3000);
            }
        }

        // ---- API ----
        let prevSessionStates = {};
        async function fetchSessions() {
            try {
                const res = await fetch('/sessions');
                const newSessions = await res.json();
                // Detect terminal transitions: mark as unread
                for (const s of newSessions) {
                    const prev = prevSessionStates[s.id];
                    if (prev === 'running' && ['stopped', 'ended'].includes(s.status) && s.id !== selectedId) {
                        viewedSessions.delete(s.id);
                        localStorage.setItem('vg_viewed', JSON.stringify([...viewedSessions]));
                    }
                    prevSessionStates[s.id] = s.status;
                }
                sessions = newSessions;
                onSessionsUpdated();
                return true;
            } catch {
                return false;
            }
        }

        async function fetchSessionDetail(id) {
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(id)}`);
                if (!res.ok) return null;
                return await res.json();
            } catch { return null; }
        }

        function cancelDetailRefresh() {
            detailRefreshTimers.forEach(clearTimeout);
            detailRefreshTimers = [];
        }

        function stopDetailPolling() {
            if (!detailPollTimer) return;
            clearInterval(detailPollTimer);
            detailPollTimer = null;
        }

        function startDetailPolling(id) {
            stopDetailPolling();
            detailPollTimer = setInterval(() => {
                if (currentView !== 'chats' || selectedId !== id) return;
                if (!pendingPrompt || pendingPrompt.sessionId !== id) {
                    stopDetailPolling();
                    return;
                }
                if (Date.now() >= pendingPrompt.expiresAt) {
                    pendingPrompt = null;
                    stopDetailPolling();
                    loadDetail(id);
                    return;
                }
                loadDetail(id);
            }, 1000);
        }

        function scheduleDetailRefresh(id) {
            if (!id) return;
            cancelDetailRefresh();
            detailRefreshTimers = [250, 1000, 2500].map(delay => setTimeout(() => {
                if (currentView === 'chats' && selectedId === id) loadDetail(id);
            }, delay));
        }

        function onSessionsUpdated() {
            // If selected session was deleted (e.g. pending merged), find replacement by name
            if (selectedId && !sessions.find(s => s.id === selectedId)) {
                const oldSession = sessions.find(s => s.name && s.name === selectedName);
                if (oldSession) {
                    selectedId = oldSession.id;
                }
            }
            // Only update chats-specific UI; assets/nodes/play views manage their own sidebar
            if (currentView === 'chats') {
                renderSidebar();
                if (selectedId) {
                    loadDetail(selectedId);
                } else if (!didAutoSelectDefault && sessions.length > 0) {
                    const orch = sessions.find(s => s.name === 'orchestrator');
                    if (orch) {
                        didAutoSelectDefault = true;
                        selectSession(orch.id);
                    }
                }
            }
        }

        // ---- Sidebar ----
        function renderSidebar() {
            if (!sessions.length) {
                sidebarBody.innerHTML = `<div style="padding:1rem 0.875rem;color:var(--stone);font-size:0.8rem">No sessions yet</div>`;
                return;
            }

            const PERSISTENT_ORDER = ['orchestrator', 'artist', 'designer', 'reviewer'];
            const persistent = [];
            const temporal = [];
            const ended = [];
            for (const s of sessions) {
                const name = (s.name || '').toLowerCase();
                if (PERSISTENT_ORDER.includes(name)) {
                    persistent.push(s);
                } else if (s.status === 'ended') {
                    ended.push(s);
                } else {
                    temporal.push(s);
                }
            }
            persistent.sort((a, b) => {
                const ai = PERSISTENT_ORDER.indexOf((a.name || '').toLowerCase());
                const bi = PERSISTENT_ORDER.indexOf((b.name || '').toLowerCase());
                return ai - bi;
            });

            const group = (label, items) => {
                if (!items.length) return '';
                return `<div class="group-label">${label}</div>` + items.map(sidebarItem).join('');
            };

            sidebarBody.innerHTML =
                group('Persistent', persistent) +
                group('Temporal', temporal) +
                group('Ended', ended);

            sidebarBody.querySelectorAll('.s-item').forEach(el => {
                const id = el.dataset.id;
                el.addEventListener('click', () => selectSession(id));
                if (id === selectedId) el.classList.add('active');
            });
        }

        function ctxBadge(s) {
            if (!s || String(s.source_app || '') !== 'claude') return '';
            const pct = s.context_pct;
            if (pct === null || pct === undefined) return '';
            const p = Number(pct);
            if (!isFinite(p)) return '';
            const cls = p >= 90 ? 'crit' : p >= 75 ? 'high' : '';
            return `<span class="s-ctx ${cls}" title="Context window ${p.toFixed(1)}%">${p.toFixed(0)}%</span>`;
        }

        function sidebarItem(s) {
            const name = displayName(s);
            const model = shortModel(s.model);
            const unread = s.status === 'stopped' && !viewedSessions.has(s.id);
            return `
            <div class="s-item${unread ? ' unread' : ''}" data-id="${esc(s.id)}">
                <div class="s-main">
                    <span class="s-name">${esc(name)}</span>
                    ${unread ? '<span class="s-unread" title="Not yet viewed"></span>' : ''}
                    ${ctxBadge(s)}
                    ${model ? `<span class="s-model">${esc(model)}</span>` : ''}
                    <button class="s-more" onclick="showMenu('${esc(s.id)}', event)" title="More">···</button>
                </div>
            </div>`;
        }

        // ---- Select session ----
        async function selectSession(id) {
            closeAtDropdown();
            cancelDetailRefresh();
            // Save draft and clear pending prompt when switching sessions
            if (selectedId && selectedId !== id) {
                pendingPrompt = null;
                stopDetailPolling();
                const t = promptInput.value;
                if (t.trim()) inputDrafts[selectedId] = t;
                else delete inputDrafts[selectedId];
            }
            selectedId = id;
            pastedImages.forEach(img => { if (img) URL.revokeObjectURL(img.objectUrl); });
            pastedImages = [];
            document.getElementById('pasted-images').innerHTML = '';
            const s = sessions.find(x => x.id === id);
            selectedName = s ? displayName(s) : null;
            // Mark as viewed
            viewedSessions.add(id);
            localStorage.setItem('vg_viewed', JSON.stringify([...viewedSessions]));
            sidebarBody.querySelectorAll('.s-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
                // Remove unread indicator immediately on click
                if (el.dataset.id === id) {
                    el.classList.remove('unread');
                    el.querySelector('.s-unread')?.remove();
                }
            });
            await loadDetail(id);
            // Restore draft for new session
            promptInput.value = inputDrafts[id] || '';
            autoResize(promptInput);
        }

        async function loadDetail(id) {
            const requestVersion = ++detailRequestVersion;
            const session = await fetchSessionDetail(id);
            if (requestVersion !== detailRequestVersion || currentView !== 'chats' || selectedId !== id) return;
            if (!session) { showWelcome(); return; }
            try {
                renderDetail(session);
            } catch (err) {
                if (currentView !== 'chats' || selectedId !== id) return;
                panelBody.innerHTML = `<div style="padding:2rem;color:var(--red);font-family:monospace;white-space:pre-wrap">Failed to render session:\n${err}</div>`;
                console.error('renderDetail failed:', err);
            }
        }

        function showWelcome() {
            detailRequestVersion += 1;
            cancelDetailRefresh();
            stopDetailPolling();
            pendingPrompt = null;
            pastedImages.forEach(img => { if (img) URL.revokeObjectURL(img.objectUrl); });
            pastedImages = [];
            document.getElementById('pasted-images').innerHTML = '';
            hideDetailHeader();
            panelBody.innerHTML = `
                <div class="welcome">
                    <h2>VibeGame Dashboard</h2>
                    <p>Select an agent session to chat,<br>or browse Assets.</p>
                </div>`;
            panelInput.style.display = 'none';
        }

        function hideDetailHeader() {
            detailHeader.classList.remove('visible');
            panelBody.classList.remove('detail-active');
            detailTitle.textContent = 'VibeGame Dashboard';
        }

        // ---- Detail ----
        function renderDetail(s) {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
                const range = sel.getRangeAt(0);
                if (panelBody.contains(range.commonAncestorContainer)) return;
            }
            detailTitle.textContent = displayName(s);
            detailHeader.classList.add('visible');
            panelBody.classList.add('detail-active');

            const messages = s.messages || [];
            const chatHtml = buildChat(messages);
            let pendingHtml = '';
            if (pendingPrompt && pendingPrompt.sessionId === s.id && s.id === selectedId) {
                const turnMessages = messages.slice(pendingPrompt.afterMessageIndex);
                const userFound = turnMessages.some(
                    m => m.role === 'user' && m.text && m.text.includes(pendingPrompt.text)
                );
                const assistantFound = turnMessages.some(
                    m => m.role === 'assistant' && m.text
                );
                if (assistantFound) {
                    pendingPrompt = null;
                    stopDetailPolling();
                    updateSendButton();
                } else if (!userFound) {
                    pendingHtml = `
                    <div class="cm-user">
                        <div class="cm-user-inner">
                            <div class="cm-message-stack cm-message-stack-user">
                                <div class="cm-user-bubble">${renderMarkdown(pendingPrompt.text)}</div>
                                ${copyAction(pendingPrompt.text, 'user')}
                            </div>
                        </div>
                    </div>`;
                }
            }
            renderedMessageCounts.set(
                s.id,
                Math.max(renderedMessageCounts.get(s.id) || 0, messages.length)
            );
            panelBody.innerHTML = `<div class="chat">${chatHtml}${pendingHtml}${activityRow(s)}</div>`;
            if (wasAtBottom) panelBody.scrollTop = panelBody.scrollHeight;

            // Show input only when tmux pane is available
            panelInput.style.display = s.tmux_pane ? 'flex' : 'none';
            updateSendButton();
        }

        function activityRow(s) {
            const awaitingReply = pendingPrompt?.sessionId === s?.id;
            if (!s || (!awaitingReply && !['running', 'waiting'].includes(s.status))) return '';
            return `
                <div class="activity-row">
                    <span class="cc-star-spinner" aria-hidden="true"></span>
                    <span class="activity-text">${esc(activityLabel(s))}</span>
                </div>`;
        }

        const spinnerVerbs = [
            'Percolating',
            'Pondering',
            'Marinating',
            'Reticulating',
            'Caramelizing',
            'Clauding',
            'Simmering',
            'Brewing',
            'Composing',
            'Untangling',
            'Distilling',
            'Polishing',
        ];

        function activityLabel(session) {
            if (session?.status === 'waiting') return 'Waiting for teammates';
            const messages = session?.messages || [];
            const seed = messages.length + Math.floor(Date.now() / 1400);
            return `${spinnerVerbs[seed % spinnerVerbs.length]}...`;
        }

        // ---- Chat builder ----
        let _toolDataMap = [];  // index -> {tool, input, result}
        let _copyTextMap = [];

        // messages: [{role, text, tool, input, id, tool_use_id, content, is_error, ts}, ...]
        function buildChat(messages) {
            let html = '';
            _toolDataMap = [];
            _copyTextMap = [];
            // tool_use entries buffered until we see the next non-tool_result
            let toolBuf = [];

            const flushTools = () => {
                if (!toolBuf.length) return;
                html += `<div class="cm-tools">` +
                    toolBuf.map(m => toolChip(m)).join('') +
                    `</div>`;
                toolBuf = [];
            };

            for (const m of messages) {
                if (m.role === 'user') {
                    flushTools();
                    html += `
                    <div class="cm-user">
                        <div class="cm-user-inner">
                            <div class="cm-message-stack cm-message-stack-user">
                                <div class="cm-user-bubble">${renderMarkdown(m.text) || '<em style="opacity:0.5">empty</em>'}</div>
                                ${copyAction(m.text, 'user')}
                            </div>
                            ${m.ts ? `<div class="cm-time">${fmtTime(m.ts)}</div>` : ''}
                        </div>
                    </div>`;

                } else if (m.role === 'tool_use') {
                    toolBuf.push(m);

                } else if (m.role === 'tool_result') {
                    // Attach result to its matching tool_use in the buffer
                    const match = toolBuf.findLast(t => t.id === m.tool_use_id);
                    if (match) match._result = m;

                } else if (m.role === 'assistant') {
                    flushTools();
                    html += `
                    <div class="cm-assistant">
                        <div class="cm-assistant-inner">
                            <div class="cm-message-stack">
                                <div class="cm-assistant-bubble">${renderMarkdown(m.text)}</div>
                                ${copyAction(m.text)}
                            </div>
                        </div>
                    </div>`;
                }
            }

            flushTools();

            if (!html) {
                html = `<div style="text-align:center;color:var(--stone);font-size:0.85rem;margin-top:2rem">No messages yet</div>`;
            }
            return html;
        }

        function copyAction(text, role = 'assistant') {
            const idx = _copyTextMap.length;
            _copyTextMap.push(text || '');
            const label = role === 'user' ? 'Copy user message' : 'Copy assistant message';
            return `
            <div class="cm-actions">
                <button class="cm-copy-btn" type="button" data-copy-idx="${idx}" title="Copy" aria-label="${label}">
                    ${copyIcon()}
                </button>
            </div>`;
        }

        function copyIcon() {
            return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5.3" y="5.3" width="7.2" height="7.2" rx="1.3"></rect>
                <path d="M3.5 10.2H3.1a1.4 1.4 0 0 1-1.4-1.4V3.1a1.4 1.4 0 0 1 1.4-1.4h5.7a1.4 1.4 0 0 1 1.4 1.4v0.4"></path>
            </svg>`;
        }

        function copiedIcon() {
            return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.2 8.4l3 3 6.6-6.8"></path>
            </svg>`;
        }

        function toolChip(m) {
            const isError = m._result?.is_error;
            const tool = m.tool || '';
            const arg  = toolArg(m);
            const idx = _toolDataMap.length;
            _toolDataMap.push({tool, input: m.input || {}, result: m._result || {}});
            // Special: interrupted event
            if (tool === 'interrupted') {
                return `
                <div class="cm-tool-chip interrupted">
                    <span class="tool-name">Interrupted by user</span>
                </div>`;
            }
            if (tool === 'StreamDisconnected') {
                return `
                <div class="cm-tool-chip interrupted" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Stream disconnected</span>
                    ${arg ? `<span class="tool-arg">·  ${esc(arg)}</span>` : ''}
                </div>`;
            }
            if (tool === 'StopHook') {
                return `
                <div class="cm-tool-chip" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Stop Hook: ${esc(arg || 'continue')}</span>
                </div>`;
            }
            if (tool === 'TaskNotification') {
                return `
                <div class="cm-tool-chip muted" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Task Notification</span>
                </div>`;
            }
            if (tool === 'SystemReminder') {
                return `
                <div class="cm-tool-chip muted">
                    <span class="tool-name">System</span>
                </div>`;
            }
            if (tool === 'SubagentNotification') {
                return `
                <div class="cm-tool-chip muted" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Teammate Report</span>
                </div>`;
            }
            if (tool === 'SessionStart') {
                return `
                <div class="cm-tool-chip muted">
                    <span class="tool-name">Session Start Context</span>
                </div>`;
            }
            if (tool === 'EnvironmentContext') {
                return `
                <div class="cm-tool-chip muted" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Environment Context</span>
                    ${arg ? `<span class="tool-arg">·  ${esc(arg)}</span>` : ''}
                </div>`;
            }
            if (tool === 'ProjectInstructions') {
                return `
                <div class="cm-tool-chip muted" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Instructions</span>
                    ${arg ? `<span class="tool-arg">·  ${esc(arg)}</span>` : ''}
                </div>`;
            }
            if (tool === 'Compact') {
                return `
                <div class="cm-tool-chip muted" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Compact</span>
                </div>`;
            }
            if (tool === 'ContextParseError') {
                return `
                <div class="cm-tool-chip error" onclick="showToolDetail(${idx})">
                    <span class="tool-name">Context parse error</span>
                    ${arg ? `<span class="tool-arg">·  ${esc(arg)}</span>` : ''}
                </div>`;
            }
            const cls  = isError ? ' error' : '';
            return `
            <div class="cm-tool-chip${cls}" onclick="showToolDetail(${idx})">
                <span class="tool-name">${esc(tool)}</span>
                ${arg ? `<span class="tool-arg">·  ${esc(arg)}</span>` : ''}
            </div>`;
        }

        function toolArg(m) {
            const inp  = m.input || {};
            const tool = m.tool  || '';
            if (['Read','Edit','Write','MultiEdit','NotebookEdit'].includes(tool))
                return shortPath(inp.file_path || '');
            if (tool === 'Bash' || tool === 'Ran') {
                const cmd = (inp.command || inp.cmd || '').trim();
                return cmd.slice(0, 64) + (cmd.length > 64 ? '…' : '');
            }
            if (['Added', 'Edited', 'Deleted', 'Viewed Image'].includes(tool))
                return shortPath(inp.path || '');
            if (tool === 'Glob') return inp.pattern || '';
            if (tool === 'Grep') {
                const pat = inp.pattern || '';
                return pat ? `/${pat.slice(0, 40)}/` : '';
            }
            if (tool === 'WebFetch' || tool === 'WebSearch')
                return (inp.url || inp.query || '').slice(0, 60);
            if (tool === 'Agent')
                return inp.description || (inp.prompt || '').slice(0, 50) || '';
            if (tool === 'EnvironmentContext')
                return [inp.current_date, inp.timezone].filter(Boolean).join(' · ');
            if (tool === 'Skill')
                return inp.name || inp.skill || '';
            if (tool === 'ProjectInstructions')
                return inp.summary || '';
            if (tool === 'Compact')
                return '';
            if (tool === 'ContextParseError')
                return inp.message || '';
            if (tool === 'StopHook')
                return inp.action || '';
            if (tool === 'StreamDisconnected')
                return (inp.message || '').slice(0, 80);
            for (const v of Object.values(inp))
                if (typeof v === 'string' && v) return v.slice(0, 60);
            return '';
        }

        function shortPath(p) {
            if (!p) return '';
            // Keep last 2-3 path segments
            const parts = p.replace(/\\/g, '/').split('/').filter(Boolean);
            return parts.length > 3 ? '…/' + parts.slice(-2).join('/') : p;
        }

        // ---- Tool detail modal ----
        const _TOOL_LABELS = {
            Read:'Read File', Write:'Write File', Edit:'Edit File', MultiEdit:'Multi Edit',
            NotebookEdit:'Notebook Edit', Bash:'Shell Command', Ran:'Shell Command', Glob:'Search Files',
            Grep:'Search Content', Agent:'Subagent', SendMessage:'Send Message',
            WebFetch:'Web Fetch', WebSearch:'Web Search', AskUserQuestion:'Ask User',
            StopHook:'Stop Hook', Skill:'Skill', SessionStart:'Session Start Context',
            EnvironmentContext:'Environment Context', ProjectInstructions:'Instructions',
            Compact:'Compact',
            ContextParseError:'Context Parse Error', StreamDisconnected:'Stream Disconnected',
        };

        function showToolDetail(idx) {
            const d = _toolDataMap[idx];
            if (!d) return;
            const tool = d.tool || '';
            const inp = d.input || {};
            const res = d.result || {};
            const overlay = document.getElementById('td-overlay');
            document.getElementById('td-name').textContent = _TOOL_LABELS[tool] || tool;
            document.getElementById('td-arg').textContent = toolArg({tool, input: inp});

            let body = '';
            // Input section - per tool type
            if (['Read','Write','Edit','MultiEdit','NotebookEdit'].includes(tool)) {
                body += inputSection(shortPath(inp.file_path || ''), inp);
            } else if (tool === 'Bash' || tool === 'Ran') {
                body += inputSection(inp.command || '', inp, 'command');
            } else if (tool === 'Glob') {
                body += inputSection(inp.pattern || '', inp, 'pattern');
            } else if (tool === 'Grep') {
                body += inputSection(inp.pattern ? `/${inp.pattern}/` : '', inp, 'pattern');
            } else if (tool === 'Agent') {
                body += inputSection(inp.description || inp.prompt || '', inp, 'prompt');
            } else if (tool === 'Skill') {
                const skillName = inp.name || inp.skill || 'skill';
                const metadata = {};
                if (inp.path) metadata.path = inp.path;
                if (inp.args) metadata.args = inp.args;
                body += inputSection(skillName, metadata);
                if (inp.content) {
                    body += `<div class="td-section-label">Content</div>`;
                    body += `<div class="cm-assistant-bubble">${renderMarkdown(inp.content)}</div>`;
                }
            } else if (tool === 'ProjectInstructions') {
                body += inputSection(
                    inp.project_path || '',
                    { source_path: inp.source_path || '' },
                    'project_path'
                );
                body += `<div class="td-section-label">Content</div>`;
                body += `<div class="cm-assistant-bubble">${renderMarkdown(inp.content || '')}</div>`;
            } else if (tool === 'EnvironmentContext') {
                body += inputSection('', inp);
            } else if (tool === 'Compact') {
                body += `<div class="td-section-label">Summary</div>`;
                body += `<div class="cm-assistant-bubble">${renderMarkdown(inp.summary || '')}</div>`;
            } else if (tool === 'ContextParseError') {
                body += `<div class="td-section-label">Error</div>`;
                body += `<div class="td-code td-error">${esc(inp.message || 'Unable to parse context injection')}</div>`;
            } else if (tool === 'StopHook') {
                body += `<div class="td-section-label">Action</div>`;
                body += `<div class="td-code">${esc(inp.action || 'continue')}</div>`;
                if (inp.details) {
                    body += `<div class="td-section-label">Details</div>`;
                    body += `<div class="td-code">${esc(inp.details)}</div>`;
                }
                if (inp.hook_run_id) {
                    body += `<div class="td-section-label">Hook Run</div>`;
                    body += `<div class="td-code">${esc(inp.hook_run_id)}</div>`;
                }
            } else {
                body += inputSection('', inp);
            }
            // Edit: show old/new diff
            if (tool === 'Edit' || tool === 'MultiEdit') {
                if (inp.old_string) {
                    body += `<div class="td-section-label">Old</div>`;
                    body += `<div class="td-code td-diff-old">${esc(inp.old_string)}</div>`;
                }
                if (inp.new_string) {
                    body += `<div class="td-section-label">New</div>`;
                    body += `<div class="td-code td-diff-new">${esc(inp.new_string)}</div>`;
                }
            }
            // Write: show content
            if (tool === 'Write' && inp.content) {
                body += `<div class="td-section-label">Content</div>`;
                body += `<div class="td-code">${esc(typeof inp.content === 'string' ? inp.content.slice(0,3000) : JSON.stringify(inp.content).slice(0,3000))}</div>`;
            }
            // Output section
            if (res.content) {
                const label = res.is_error ? 'Error' : 'Output';
                body += `<div class="td-section-label">${label}</div>`;
                body += `<div class="td-code${res.is_error ? ' td-error' : ''}">${esc(res.content)}</div>`;
            }
            document.getElementById('td-body').innerHTML = body;
            overlay.style.display = 'flex';
        }

        function inputSection(primary, inp, hideKey) {
            let html = '<div class="td-section-label">Input</div>';
            if (primary) {
                html += `<div class="td-code">${esc(primary)}</div>`;
            }
            // Show other input fields as key-value
            const skip = new Set(['file_path','command','pattern','prompt','description','content','old_string','new_string', hideKey]);
            const extras = Object.entries(inp).filter(([k]) => !skip.has(k));
            if (extras.length) {
                html += '<div class="td-kv">';
                for (const [k, v] of extras) {
                    const val = typeof v === 'string' ? v : JSON.stringify(v);
                    html += `<div class="td-kv-row"><span class="td-kv-key">${esc(k)}</span><span class="td-kv-val">${esc(val)}</span></div>`;
                }
                html += '</div>';
            }
            return html;
        }

        function closeToolDetail() {
            document.getElementById('td-overlay').style.display = 'none';
        }

        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            if (document.getElementById('preview-overlay').style.display !== 'none') {
                closeFilePreview();
                return;
            }
            if (document.getElementById('td-overlay').style.display !== 'none')
                closeToolDetail();
        });

        panelBody.addEventListener('click', async e => {
            const btn = e.target.closest('.cm-copy-btn');
            if (!btn) return;
            if (btn.classList.contains('md-code-copy-btn')) return;
            e.preventDefault();
            const idx = Number(btn.dataset.copyIdx);
            const text = Number.isInteger(idx) && idx >= 0 ? _copyTextMap[idx] : '';
            try {
                await copyToClipboard(text || '');
                showCopiedState(btn, 'Copy');
            } catch (err) {
                toast('Copy failed: ' + err.message, 'error');
            }
        });

        document.addEventListener('click', async e => {
            const btn = e.target.closest('.md-code-copy-btn');
            if (!btn) return;
            e.preventDefault();
            const code = btn.closest('.md-pre')?.querySelector('code')?.textContent || '';
            try {
                await copyToClipboard(code);
                showCopiedState(btn, 'Copy code');
            } catch (err) {
                toast('Copy failed: ' + err.message, 'error');
            }
        });

        function showCopiedState(btn, title) {
            btn.classList.add('copied');
            btn.innerHTML = copiedIcon();
            btn.title = 'Copied';
            setTimeout(() => {
                if (!btn.isConnected) return;
                btn.classList.remove('copied');
                btn.innerHTML = copyIcon();
                btn.title = title;
            }, 1200);
        }

        async function copyToClipboard(text) {
            if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            const ok = document.execCommand('copy');
            textarea.remove();
            if (!ok) throw new Error('Clipboard unavailable');
        }

        document.addEventListener('click', e => {
            const link = e.target.closest('.md-file-link');
            if (!link) return;
            e.preventDefault();
            openFilePreview(link.dataset.path || '', link.dataset.label || link.textContent || '');
        });

        // ---- Dropdown menu ----
        let activeDropdown = null;

        function showMenu(id, e) {
            e.stopPropagation();
            closeDropdown();

            const btn = e.currentTarget;
            const rect = btn.getBoundingClientRect();

            const menu = document.createElement('div');
            menu.className = 's-dropdown';
            menu.innerHTML = `
                <button class="s-drop-item" data-action="status">Status</button>
                <button class="s-drop-item danger" data-action="delete">Delete</button>`;
            menu.style.top  = `${rect.bottom + 4}px`;
            menu.style.left = `${rect.left}px`;
            document.body.appendChild(menu);
            if (menu.getBoundingClientRect().bottom > window.innerHeight) {
                menu.style.top = `${rect.top - menu.offsetHeight - 4}px`;
            }

            menu.addEventListener('click', async ev => {
                const action = ev.target.dataset.action;
                closeDropdown();
                if (action === 'delete') { await handleDelete(id); }
                if (action === 'status') { showSessionStatus(id); }
            });

            activeDropdown = menu;
        }

        async function showSessionStatus(id) {
            const fresh = await fetchSessionDetail(id);
            const s = fresh || sessions.find(x => x.id === id);
            if (!s) return;
            const usage = s.token_usage;
            const tokenFields = usage ? [
                ['token_usage', usage.provider || 'unknown'],
                ['input', fmtToken(usage.input_tokens)],
                ['cached_input', fmtToken(usage.cached_input_tokens)],
                ['output', fmtToken(usage.output_tokens)],
                ['total', fmtToken(usage.total_tokens)],
            ] : [
                ['token_usage', '-'],
            ];
            const fields = [
                ['session_id', s.session_id],
                ['working_dir', s.working_dir],
                ['transcript_path', s.transcript_path],
                ['tmux_pane', s.tmux_pane],
                ['model', s.model],
                ...tokenFields,
            ];
            const overlay = document.createElement('div');
            overlay.className = 'status-backdrop';
            overlay.innerHTML = `
                <div class="status-modal">
                    <div class="status-modal-head">
                        <span class="status-title">Session Info</span>
                        <button class="status-close" type="button" aria-label="Close">&times;</button>
                    </div>
                    <div class="status-fields">
                        ${fields.map(([k, v]) => `
                            <div class="status-row">
                                <span class="status-key">${esc(k)}</span>
                                <span class="status-value">${esc(v || '-')}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            overlay.addEventListener('click', ev => { if (ev.target === overlay) overlay.remove(); });
            overlay.querySelector('.status-close')?.addEventListener('click', () => overlay.remove());
            document.body.appendChild(overlay);
        }

        // ---- Handlers ----
