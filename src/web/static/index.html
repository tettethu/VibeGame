        // ---- Markdown renderer ----
        const _previewTextExts = new Set(['.json','.txt','.yaml','.yml','.toml','.py','.js','.ts','.html','.css','.xml','.csv','.log']);
        const _previewMarkdownExts = new Set(['.md']);
        const _previewImageExts = new Set(['.png','.jpg','.jpeg','.webp','.gif','.svg','.bmp']);

        function previewKindForPath(path) {
            if (!path || /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(path)) return null;
            const ext = path.split('?')[0].toLowerCase().replace(/^.*(\.[^.]+)$/, '$1');
            if (_previewMarkdownExts.has(ext)) return 'markdown';
            if (_previewTextExts.has(ext)) return 'text';
            if (_previewImageExts.has(ext)) return 'image';
            return 'file';
        }

        function isPreviewableAbsolutePath(path) {
            return !!previewKindForPath(path);
        }

        function previewApiUrl(path) {
            return `/api/preview-file?path=${encodeURIComponent(path)}`;
        }

        function renderPreviewLink(label, path) {
            return `<a href="#" class="md-file-link" data-path="${escAttr(path)}" data-label="${escAttr(label)}">${label}</a>`;
        }

        function renderImagePreviewLink(label, path) {
            const safeLabel = label || path.split('/').pop() || path;
            const src = previewApiUrl(path);
            return `<figure class="md-image-preview">
                <a href="#" class="md-file-link md-image-preview-link" data-path="${escAttr(path)}" data-label="${escAttr(safeLabel)}">
                    <img src="${escAttr(src)}" alt="${escAttr(safeLabel)}" loading="lazy" onerror="this.closest('.md-image-preview')?.classList.add('load-failed')">
                </a>
                <figcaption>
                    <span class="md-image-preview-title">${renderPreviewLink(safeLabel, path)}</span>
                    <span class="md-image-preview-path">${esc(path)}</span>
                </figcaption>
            </figure>`;
        }

        function renderMarkdownPathLink(label, path) {
            if (!isPreviewableAbsolutePath(path)) return null;
            return previewKindForPath(path) === 'image'
                ? renderImagePreviewLink(label, path)
                : renderPreviewLink(label, path);
        }

        function renderMarkdownExternalLink(label, url) {
            return `<a href="${url}" class="md-external-link" target="_blank" rel="noopener noreferrer">${label}</a>`;
        }

        function applyInline(s) {
            let safe = esc(s);
            const codeTokens = [];
            safe = safe.replace(/`([^`]+)`/g, (_, code) => {
                const token = `@@CODE${codeTokens.length}@@`;
                codeTokens.push(`<code class="md-code">${code}</code>`);
                return token;
            });
            safe = safe
                .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)\n]+)\)/gi, (_, label, url) => {
                    return renderMarkdownExternalLink(label, url);
                })
                .replace(/\[([^\]\n]+)\]\((\/[^)\n]+)\)/g, (match, label, path) => {
                    return renderMarkdownPathLink(label, path) || match;
                })
                .replace(/\[([^\]\n]+)\]\((file:\/\/[^)\n]+)\)/g, (match, label, url) => {
                    const path = url.replace(/^file:\/\//, '');
                    return renderMarkdownPathLink(label, path) || match;
                })
                .replace(/\[([^\]\n]+)\]\(((?![a-zA-Z][a-zA-Z0-9+.-]*:)[^)\n]+)\)/g, (match, label, path) => {
                    return renderMarkdownPathLink(label, path) || match;
                })
                .replace(/(^|[^\\$])\$([^$\n]+?)\$(?!\$)/g, '$1<span class="md-math-inline">$2</span>')
                .replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>')
                .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
            return safe.replace(/@@CODE(\d+)@@/g, (_, index) => codeTokens[Number(index)] || '');
        }

        function mdText(raw) {
            const lines = String(raw).split('\n');
            let out = '', inUl = false, inOl = false, inTable = false;

            const closeList = () => {
                if (inUl) { out += '</ul>'; inUl = false; }
                if (inOl) { out += '</ol>'; inOl = false; }
            };
            const closeTable = () => {
                if (inTable) { out += '</tbody></table>'; inTable = false; }
            };
            const isTableRow = l => /^\|.+\|$/.test(l.trim());
            const isSepRow   = l => /^\|[-\s:|]+\|$/.test(l.trim());
            const parseCells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                // Table: detect header row followed by separator
                if (!inTable && isTableRow(line) && i + 1 < lines.length && isSepRow(lines[i + 1])) {
                    closeList();
                    const hdr = parseCells(line);
                    out += '<table class="md-table"><thead><tr>' +
                        hdr.map(c => `<th>${applyInline(c)}</th>`).join('') +
                        '</tr></thead><tbody>';
                    inTable = true;
                    i++; // skip separator row
                    continue;
                }
                if (inTable && isTableRow(line)) {
                    const cells = parseCells(line);
                    out += '<tr>' + cells.map(c => `<td>${applyInline(c)}</td>`).join('') + '</tr>';
                    continue;
                }
                if (inTable) { closeTable(); }

                const heading = line.match(/^(#{1,6})\s+(.+)$/);
                if (heading) {
                    closeList();
                    const level = heading[1].length;
                    out += `<h${level} class="md-h${level}">${applyInline(heading[2])}</h${level}>`;
                } else if (/^[-*] /.test(line)) {
                    if (!inUl) { closeList(); out += '<ul>'; inUl = true; }
                    out += `<li>${applyInline(line.slice(2))}</li>`;
                } else if (/^\d+\. /.test(line)) {
                    if (!inOl) { closeList(); out += '<ol>'; inOl = true; }
                    out += `<li>${applyInline(line.replace(/^\d+\.\s+/, ''))}</li>`;
                } else if (line.trim() === '') {
                    closeList();
                    out += '<br>';
                } else {
                    closeList();
                    out += applyInline(line) + '<br>';
                }
            }
            closeList(); closeTable();
            return out.replace(/(<br>)+$/, '');
        }

        function renderMarkdown(raw) {
            if (!raw) return '';
            // Split fenced code blocks out first to protect them
            const parts = [];
            const fenceRe = /```(\w*)\n?([\s\S]*?)```/g;
            let last = 0, m;
            while ((m = fenceRe.exec(raw)) !== null) {
                if (m.index > last) parts.push({fence: false, s: raw.slice(last, m.index)});
                parts.push({fence: true, s: m[2]});
                last = m.index + m[0].length;
            }
            if (last < raw.length) parts.push({fence: false, s: raw.slice(last)});

            return parts.map(p => {
                if (p.fence) {
                    const code = p.s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                    return `<pre class="md-pre"><button class="cm-copy-btn md-code-copy-btn" type="button" title="Copy code" aria-label="Copy code">${copyIcon()}</button><code>${code.trim()}</code></pre>`;
                }
                return p.s.split(/(\$\$[\s\S]*?\$\$)/g).map(part => {
                    if (part.startsWith('$$') && part.endsWith('$$')) {
                        return `<span class="md-math-block">${esc(part.slice(2, -2).trim())}</span>`;
                    }
                    return mdText(part);
                }).join('');
            }).join('');
        }

        async function openFilePreview(path, label = '') {
            const kind = previewKindForPath(path);
            if (!kind) return;
            const fname = label || path.split('/').pop() || path;

            if (kind === 'file') {
                try { await fetch(`/api/reveal-file?path=${encodeURIComponent(path)}`); } catch(e) {}
                toast(`Revealed ${fname} in Finder`, 'info');
                return;
            }

            const labels = { image: 'Image Preview', text: 'File Preview', markdown: 'Markdown Preview' };
            document.getElementById('preview-context').textContent = labels[kind] || 'Preview';
            document.getElementById('preview-title').textContent = fname;
            document.getElementById('preview-path').textContent = path;

            const body = document.getElementById('preview-body');
            body.innerHTML = `<div class="preview-empty">Loading...</div>`;
            document.getElementById('preview-overlay').style.display = 'flex';

            if (kind === 'image') {
                body.innerHTML = `<div class="preview-image-wrap"><img class="preview-image" src="${previewApiUrl(path)}" alt="${esc(fname)}"></div>`;
                return;
            }

            try {
                const res = await fetch(previewApiUrl(path), { cache: 'no-store' });
                if (!res.ok) throw new Error('Preview load failed');
                const text = await res.text();
                if (kind === 'markdown') {
                    body.innerHTML = `<div class="preview-markdown">${renderMarkdown(text)}</div>`;
                } else {
                    body.innerHTML = `<pre class="preview-plaintext">${esc(text)}</pre>`;
                }
            } catch (e) {
                body.innerHTML = `<div class="preview-empty">${esc(e.message || 'Preview load failed')}</div>`;
            }
        }

        function closeFilePreview() {
            document.getElementById('preview-overlay').style.display = 'none';
            document.getElementById('preview-body').innerHTML = '';
        }

        // ---- Prompt send ----
        function selectedSession() {
            return sessions.find(session => session.id === selectedId) || null;
        }

        function restoresInterruptedPrompt(sourceApp) {
            return ['claude', 'cc', 'ccs'].includes(String(sourceApp || '').replace(/-pending$/, ''));
        }

        function updateSendButton() {
            const awaitingReply = pendingPrompt?.sessionId === selectedId;
            const hasDraft = promptInput.value.trim() !== '';
            const showInterrupt = awaitingReply && !hasDraft;
            sendBtn.textContent = showInterrupt ? '■' : '↑';
            sendBtn.title = showInterrupt ? 'Interrupt (Ctrl+C)' : 'Send (Enter)';
            sendBtn.disabled = interruptInFlight;
        }

        async function interruptPrompt() {
            if (!selectedId || pendingPrompt?.sessionId !== selectedId || interruptInFlight) return;
            const sessionId = selectedId;
            const session = selectedSession();
            const interruptedPrompt = pendingPrompt;
            interruptInFlight = true;
            updateSendButton();
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(sessionId)}/interrupt`, {
                    method: 'POST',
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                pendingPrompt = null;
                stopDetailPolling();
                if (restoresInterruptedPrompt(session?.source_app)) {
                    inputDrafts[sessionId] = interruptedPrompt.draft;
                    if (selectedId === sessionId) {
                        promptInput.value = interruptedPrompt.draft;
                        autoResize(promptInput);
                    }
                } else {
                    delete inputDrafts[sessionId];
                }
                loadDetail(sessionId);
                scheduleDetailRefresh(sessionId);
            } catch (e) {
                toast(e.message, 'error');
            } finally {
                interruptInFlight = false;
                updateSendButton();
                promptInput.focus();
            }
        }

        async function sendPrompt() {
            if (!selectedId) return;
            const sessionId = selectedId;
            const prompt = promptInput.value.trim();
            if (!prompt) return;
            // Length is enforced server-side; its 400 response surfaces through
            // the catch below with the same message, so no limit is duplicated here.
            sendBtn.disabled = true;
            try {
                const res = await fetch(`/sessions/${encodeURIComponent(sessionId)}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed');
                pendingPrompt = {
                    sessionId,
                    text: data.formatted_prompt || prompt,
                    draft: prompt,
                    afterMessageIndex: renderedMessageCounts.get(sessionId) || 0,
                    expiresAt: Date.now() + 5 * 60 * 1000,
                };
                promptInput.value = '';
                delete inputDrafts[sessionId];
                autoResize(promptInput);
                updateSendButton();
                // Clean up pasted image thumbnails after sending
                pastedImages.forEach(img => { if (img) URL.revokeObjectURL(img.objectUrl); });
                pastedImages = [];
                document.getElementById('pasted-images').innerHTML = '';
                loadDetail(sessionId);
                scheduleDetailRefresh(sessionId);
                startDetailPolling(sessionId);
            } catch (e) {
                toast(e.message, 'error');
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        sendBtn.addEventListener('click', () => {
            if (pendingPrompt?.sessionId === selectedId && !promptInput.value.trim()) interruptPrompt();
            else sendPrompt();
        });
        promptInput.addEventListener('input', () => {
            autoResize(promptInput);
            updateSendButton();
        });
        promptInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendPrompt(); }
        });

        // ---- Paste image handler ----
        function insertAtCursor(el, text) {
            const start = el.selectionStart;
            const end = el.selectionEnd;
            const before = el.value.substring(0, start);
            const after = el.value.substring(end);
            el.value = before + text + after;
            el.selectionStart = el.selectionEnd = start + text.length;
            el.dispatchEvent(new Event('input'));
        }

        function showPastedThumb(file) {
            const container = document.getElementById('pasted-images');
            const objectUrl = URL.createObjectURL(file);
            const idx = pastedImages.length;

            const thumb = document.createElement('div');
            thumb.className = 'pasted-thumb';
            thumb.innerHTML = `<img src="${objectUrl}" alt="pasted">
                <button class="thumb-remove" onclick="removePastedThumb(${idx})">x</button>`;
            container.appendChild(thumb);

            pastedImages.push({ path: null, objectUrl, thumb, file });
            return idx;
        }

        function removePastedThumb(idx) {
            const img = pastedImages[idx];
            if (!img) return;
            URL.revokeObjectURL(img.objectUrl);
            img.thumb.remove();
            pastedImages[idx] = null;
            // Remove nulls to avoid gaps
            pastedImages = pastedImages.filter(Boolean);
        }

        promptInput.addEventListener('paste', async e => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (!file || !selectedId) {
                        toast('No session selected', 'error');
                        return;
                    }
                    const thumbIdx = showPastedThumb(file);
                    const form = new FormData();
                    form.append('session_id', selectedId);
                    form.append('image', file);
                    try {
                        const res = await fetch('/upload-image', { method: 'POST', body: form });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || 'Upload failed');
                        pastedImages[thumbIdx].path = data.path;
                        insertAtCursor(promptInput, ' ' + data.path + ' ');
                    } catch (err) {
                        removePastedThumb(thumbIdx);
                        toast(err.message, 'error');
                    }
                    return;
                }
            }
        });

        // ---- @ file autocomplete ----
        let atDropdown = null;
        let atItems = [];
        let atSelected = -1;
        let atQuery = '';
        let atDebounce = null;

        function showAtDropdown(files, query) {
            atItems = files;
            atSelected = -1;
            atQuery = query;
            atDropdown?.remove();
            if (!files.length) return;
            const rect = promptInput.getBoundingClientRect();
            atDropdown = document.createElement('div');
            atDropdown.className = 'at-dropdown';
            atDropdown.style.left = rect.left + 'px';
            atDropdown.style.width = rect.width + 'px';
            atDropdown.innerHTML = files.map((f, i) => {
                const label = query
                    ? f.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'g'), '<strong>$1</strong>')
                    : f;
                return `<button class="at-item" data-index="${i}">${label}</button>`;
            }).join('');
            document.body.appendChild(atDropdown);
            atDropdown.style.top = (rect.top - atDropdown.offsetHeight - 4) + 'px';
            atDropdown.querySelectorAll('.at-item').forEach(el => {
                el.addEventListener('click', () => selectAtItem(el));
            });
        }

        function selectAtItem(el) {
            const idx = parseInt(el.dataset.index);
            const file = atItems[idx];
            if (!file) return;
            const fragment = '@' + atQuery;
            const start = promptInput.selectionStart;
            const before = promptInput.value.substring(0, start);
            const atIdx = before.lastIndexOf(fragment);
            if (atIdx !== -1) {
                promptInput.value = before.substring(0, atIdx) + '@' + file + ' ' + promptInput.value.substring(start);
                const newPos = atIdx + file.length + 2;
                promptInput.selectionStart = promptInput.selectionEnd = newPos;
            }
            closeAtDropdown();
            promptInput.focus();
        }

        function closeAtDropdown() {
            atDropdown?.remove();
            atDropdown = null;
            atItems = [];
            atSelected = -1;
        }

        promptInput.addEventListener('input', () => {
            const pos = promptInput.selectionStart;
            const before = promptInput.value.substring(0, pos);
            const atIdx = before.lastIndexOf('@');
            if (atIdx === -1) { closeAtDropdown(); return; }
            const fragment = before.substring(atIdx + 1);
            if (/\s/.test(fragment)) { closeAtDropdown(); return; }
            clearTimeout(atDebounce);
            atDebounce = setTimeout(async () => {
                if (!selectedId) return;
                try {
                    const res = await fetch(`/sessions/${selectedId}/files?prefix=${encodeURIComponent(fragment)}`);
                    const data = await res.json();
                    if (res.ok) showAtDropdown(data.files || [], fragment);
                } catch (_) {}
            }, 150);
            autoResize(promptInput);
        });

        promptInput.addEventListener('keydown', e => {
            if (!atDropdown) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                atSelected = Math.min(atSelected + 1, atItems.length - 1);
                renderAtSelected();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                atSelected = Math.max(atSelected - 1, 0);
                renderAtSelected();
            } else if (e.key === 'Enter' || e.key === 'Tab') {
                if (atSelected >= 0) {
                    e.preventDefault();
                    const el = atDropdown.querySelector(`[data-index="${atSelected}"]`);
                    if (el) selectAtItem(el);
                }
            } else if (e.key === 'Escape') {
                closeAtDropdown();
            }
        });

        function renderAtSelected() {
            atDropdown?.querySelectorAll('.at-item').forEach((el, i) => {
                el.classList.toggle('selected', i === atSelected);
            });
        }

        document.addEventListener('click', e => {
            if (!atDropdown || promptInput.contains(e.target) || atDropdown.contains(e.target)) return;
            closeAtDropdown();
        });

        // ---- Toast ----
        function toast(msg, type = 'info') {
            document.querySelector('.toast')?.remove();
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        // ---- Helpers ----
        function displayName(s) {
            if (s.name) return s.name;
            if (s.working_dir) {
                const parts = s.working_dir.replace(/\/$/, '').split('/');
                return parts[parts.length - 1] || s.working_dir;
            }
            return s.session_id || s.id;
        }

        function shortModel(m) {
            if (!m) return '';
            if (m.startsWith('claude-')) {
                const parts = m.split('-');
                return parts[1] || m;
            }
            return m;
        }

        function esc(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function fmtTime(ts) {
            if (!ts) return '';
            return new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function fmtToken(n) {
            if (n == null || Number.isNaN(Number(n))) return '-';
            return Number(n).toLocaleString('en-US');
        }

        function reltime(ts) {
            if (!ts) return '';
            const diff = Date.now() - ts;
            const s = Math.floor(diff / 1000);
            if (s < 60) return `${s}s`;
            const m = Math.floor(s / 60);
            if (m < 60) return `${m}m`;
            return `${Math.floor(m / 60)}h`;
        }

        // ---- Dashboard shutdown ----
        async function shutdownDashboard() {
            const btn = document.getElementById('shutdown-btn');
            if (btn) btn.disabled = true;
            try {
                const res = await fetch('/api/dashboard/shutdown', { method: 'POST' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'Shutdown failed');
                toast('Session closed. You can close this page now.', 'success');
            } catch (e) {
                if (btn) btn.disabled = false;
                toast(e.message || 'Shutdown failed', 'error');
            }
        }

        // ---- Permission requests ----
        let permQueue = [];
        let permCurrent = null;

        function handlePermissionRequest(data) {
            const requestId = data?.request_id;
            if (requestId && (
                permCurrent?.request_id === requestId ||
                permQueue.some(p => p.request_id === requestId)
            )) return;
            permQueue.push(data);
            if (!permCurrent) showNextPermission();
        }

        function showNextPermission() {
            if (!permQueue.length) { permCurrent = null; hidePermissionOverlay(); return; }
            permCurrent = permQueue.shift();
            renderPermissionModal(permCurrent);
        }

        // Simple markdown for permission modal
        function renderMarkdownSimple(text) {
            return text.split('\n').map(line => {
                if (/^### /.test(line)) return `<div class="md-h3">${esc(line.slice(4))}</div>`;
                if (/^## /.test(line))  return `<div class="md-h2">${esc(line.slice(3))}</div>`;
                if (/^# /.test(line))   return `<div class="md-h1">${esc(line.slice(2))}</div>`;
                if (/^---+$/.test(line.trim())) return '<hr class="md-hr">';
                if (/^[-*] /.test(line)) return `<div class="md-li">${inline(line.slice(2))}</div>`;
                if (/^\d+\. /.test(line)) return `<div class="md-li">${inline(line.replace(/^\d+\. /, ''))}</div>`;
                if (line.trim() === '') return '<div class="md-gap"></div>';
                return `<div class="md-p">${inline(line)}</div>`;
            }).join('');
        }
        function inline(s) {
            return esc(s)
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
        }

        // Tool name → human label
        const TOOL_LABELS = {
            ExitPlanMode: 'Approve Plan', EnterPlanMode: 'Enter Plan Mode',
            Bash: 'Shell Command', Write: 'Write File', Edit: 'Edit File',
            Read: 'Read File', Glob: 'Find Files', WebFetch: 'Fetch URL',
            WebSearch: 'Web Search', Agent: 'Spawn Agent',
        };

        function renderPermissionModal(data) {
            const toolName = data.tool_name || 'Unknown';
            document.getElementById('perm-context').textContent = 'Permission Request';
            document.getElementById('perm-tool-name').textContent = TOOL_LABELS[toolName] || toolName;

            // Content block
            const container = document.getElementById('perm-content-block');
            const input = data.tool_input || {};
            if (toolName === 'ExitPlanMode' && data.plan_text) {
                container.className = 'perm-doc-block';
                container.innerHTML = renderMarkdownSimple(data.plan_text);
            } else {
                container.className = 'perm-code-block';
                let text = '';
                if (input.command)          text = '$ ' + input.command;
                else if (input.file_path)   text = input.file_path + (input.content != null ? '\n\n[' + String(input.content).length + ' chars]' : '');
                else if (input.old_string != null) text = '− ' + String(input.old_string).slice(0,200) + '\n+ ' + String(input.new_string).slice(0,200);
                else if (input.url)         text = input.url;
                else if (input.query)       text = input.query;
                else                        text = JSON.stringify(input, null, 2);
                container.textContent = text;
            }

            // Meta: working dir only
            document.getElementById('perm-meta').textContent = data.cwd || '';

            // Suggestions
            const sugs = data.permission_suggestions || [];
            const sugEl = document.getElementById('perm-suggestions');
            if (sugs.length) {
                document.getElementById('perm-suggestions-list').innerHTML = sugs.map(s => {
                    const rule = s.rules?.[0];
                    const label = rule?.ruleContent ? `${rule.toolName}: ${rule.ruleContent}` : rule?.toolName || JSON.stringify(s);
                    return `<span class="perm-sug-item">${esc(label)}</span>`;
                }).join('');
                sugEl.style.display = '';
            } else {
                sugEl.style.display = 'none';
            }

            // Queue count
            const total = permQueue.length;
            document.getElementById('perm-count').textContent = total > 0 ? `+${total} queued` : '';

            document.getElementById('perm-overlay').style.display = 'flex';
        }

        function hidePermissionOverlay() {
            document.getElementById('perm-overlay').style.display = 'none';
        }

        function dismissPermission() { decidePermission('deny'); }

        async function decidePermission(behavior) {
            if (!permCurrent) { console.warn('[perm] permCurrent is null, aborting'); return; }
            const requestId = permCurrent.request_id;
            permCurrent = null;
            hidePermissionOverlay();
            try {
                const res = await fetch(`/permission/${requestId}/decide`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ behavior })
                });
            } catch (e) { console.error('[perm] decide fetch error', e); }
            showNextPermission();
        }

        async function fetchPendingPermissions() {
            try {
                const res = await fetch('/permission');
                const pending = await res.json();
                for (const p of pending) handlePermissionRequest(p);
                return true;
            } catch {
                return false;
            }
        }

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', () => {
            const restoreView = () => {
                const view = viewFromHash();
                if (view === 'play') onPlayNavClick(false);
                else switchView(view, false);
            };
            window.addEventListener('hashchange', restoreView);
            restoreView();
            connectWebSocket();
            fetchSessions();
            fetchPendingPermissions();
        });
    </script>
    <script type="module">
        import * as bridge from '/editor/dashboard-bridge.js';
        import * as objects from '/editor/objects-bridge.js';
        window._assetEditor = bridge;
        window._objectEditor = objects;
    </script>
</body>
