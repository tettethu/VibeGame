<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeGame Dashboard</title>
    <script>
        (() => {
            try {
                const saved = localStorage.getItem('vg_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if ((saved ? saved === 'dark' : prefersDark)) {
                    document.documentElement.dataset.theme = 'dark';
                }
            } catch {}
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --parchment:    #f5f4ed;
            --ivory:        #faf9f5;
            --warm-sand:    #e8e6dc;
            --near-black:   rgb(11, 11, 11);
            --dark-surface: rgb(248, 248, 246);
            --charcoal:     rgb(17, 17, 17);
            --olive:        rgb(17, 17, 17);
            --stone:        rgb(123, 121, 116);
            --warm-silver:  hsl(60, 2%, 69%);
            --border-cream: #f0eee6;
            --border-warm:  #e8e6dc;
            --ring-warm:    #d1cfc5;
            --terracotta:   #c96442;
            --error:        #b53333;
            --focus-blue:   #3898ec;
            --green:        #4a8a4a;
            --green-light:  #6a9e6a;
            --code-bg:      #eeece4;
            --code-border:  #d8d5ca;
            --code-action-bg: rgba(255,255,255,0.55);
            --sidebar-w:    280px;
            --header-h:     52px;
            --session-font:  'Playfair Display', Georgia, 'Times New Roman', serif;
            --content-font:  'KaTeX_Main', Georgia, 'Times New Roman', 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'Source Han Serif SC', SimSun, serif;
            --bg:           var(--parchment);
            --text:         var(--charcoal);
            /* chat bubbles */
            --user-bg:      rgb(239, 238, 235);
            --user-fg:      rgb(17, 17, 17);
            --asst-bg:      #faf9f5;
            --asst-fg:      rgb(17, 17, 17);
            --asst-border:  #f0eee6;
        }

        [data-theme="dark"] {
            --parchment:    #1a1916;
            --ivory:        #201e1b;
            --warm-sand:    #2a2825;
            --near-black:   #f0eee6;
            --dark-surface: rgb(31, 31, 30);
            --charcoal:     #d4d0c8;
            --olive:        #d4d0c8;
            --stone:        #8a867e;
            --warm-silver:  #5e5d59;
            --border-cream: #2a2825;
            --border-warm:  #322f2c;
            --ring-warm:    #3a3a38;
            --terracotta:   #d97757;
            --error:        #e05555;
            --green:        #5a9e5a;
            --green-light:  #7ab87a;
            --code-bg:      #171614;
            --code-border:  #37342f;
            --code-action-bg: rgba(255,255,255,0.07);
            --bg:           var(--parchment);
            --text:         var(--charcoal);
            /* chat bubbles */
            --user-bg:      #0a0a09;
            --user-fg:      #faf9f5;
            --asst-bg:      #252523;
            --asst-fg:      #b0aea5;
            --asst-border:  #2e2e2c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif;
            background: var(--dark-surface);
            color: var(--charcoal);
            font-size: 14px;
            line-height: 1.5;
            overflow: hidden;
        }

        /* ====== Logo (in sidebar top) ====== */
        .logo {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--near-black);
            letter-spacing: -0.01em;
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
        }
        .logo-dot { color: var(--terracotta); }
        .layout.collapsed .logo { opacity: 0; }


        /* ====== Layout ====== */
        .layout {
            height: 100vh;
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            transition: grid-template-columns 0.22s ease;
        }
        .layout.collapsed { grid-template-columns: 44px 1fr; }

        /* ====== Sidebar ====== */
        .sidebar {
            border-right: 1px solid var(--border-warm);
            background: var(--dark-surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ====== Sidebar Nav ====== */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0.5rem 0;
            gap: 1px;
            flex-shrink: 0;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4375rem 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            color: var(--olive);
            font-size: 0.875rem;
            font-weight: 400;
            transition: background 0.1s, color 0.1s;
            user-select: none;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .nav-item:hover { background: var(--warm-sand); color: var(--near-black); }
        .nav-item.active { background: var(--warm-sand); color: var(--near-black); font-weight: 500; }
        .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.7; }
        .nav-item.active svg { opacity: 1; }
        .layout.collapsed .nav-item span { display: none; }
        .layout.collapsed .sidebar-nav { padding: 0.5rem 0.25rem 0; }

        /* ====== Play View (static game preview) ====== */
        .play-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .play-toolbar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1rem;
            border-bottom: 1px solid var(--border-cream);
            flex-shrink: 0;
        }
        .play-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 0.9375rem;
            font-weight: 500;
            color: var(--olive);
        }
        .play-port {
            font-size: 0.6875rem;
            color: var(--stone);
            font-family: 'SFMono-Regular', Consolas, monospace;
        }
        .play-iframe-wrap {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .play-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .play-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: var(--stone);
        }
        .play-placeholder-icon {
            font-size: 3rem;
            opacity: 0.3;
        }
        .play-placeholder p {
            font-size: 0.875rem;
            text-align: center;
            line-height: 1.6;
        }
        .play-placeholder code {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.8em;
            background: var(--warm-sand);
            padding: 0.1em 0.4em;
            border-radius: 4px;
        }

        /* ====== Card Grid (Assets / Nodes) ====== */
        .card-grid-view {
            padding: 2rem;
        }
        .card-grid-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .card-grid-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--near-black);
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }
        .card-item {
            background: var(--dark-surface);
            border: 1px solid var(--border-warm);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.15s, border-color 0.15s;
        }
        .card-item:hover {
            border-color: var(--ring-warm);
            box-shadow: rgba(0,0,0,0.06) 0 4px 16px;
        }
        .card-thumb {
            width: 100%;
            aspect-ratio: 4/3;
            background: var(--warm-sand);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-cream);
        }
        .card-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }
        .tileset-preview {
            --tile-grid-x: 100%;
            --tile-grid-y: 100%;
            --tileset-img-w: 100%;
            --tileset-img-h: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            line-height: 0;
        }
        .tileset-preview img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .tileset-preview.ready::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--tileset-img-w);
            height: var(--tileset-img-h);
            transform: translate(-50%, -50%);
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.42) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.42) 1px, transparent 1px),
                linear-gradient(to right, rgba(0,0,0,0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.22) 1px, transparent 1px);
            background-size:
                var(--tile-grid-x) 100%,
                100% var(--tile-grid-y),
                var(--tile-grid-x) 100%,
                100% var(--tile-grid-y);
            background-position:
                0 0,
                0 0,
                1px 0,
                0 1px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
        }
        .card-thumb .card-placeholder {
            color: var(--stone);
            font-size: 2rem;
            opacity: 0.5;
        }
        .card-body {
            padding: 0.75rem;
        }
        .card-name {
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--near-black);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-meta {
            font-size: 0.6875rem;
            color: var(--stone);
            margin-top: 0.25rem;
        }

        /* ====== Asset File Tree (sidebar) ====== */
        .at-folder {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.3rem 0.5rem;
            cursor: pointer;
            font-size: 0.8125rem;
            color: var(--olive);
            border-radius: 6px;
            margin: 1px 0.375rem;
            user-select: none;
        }
        .at-folder:hover { background: var(--warm-sand); }
        .at-folder.active { background: var(--warm-sand); color: var(--near-black); }
        .at-arrow { font-size: 0.625rem; width: 0.75rem; flex-shrink: 0; text-align: center; }
        .at-folder-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .at-file {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            font-size: 0.8125rem;
            color: var(--olive);
            border-radius: 6px;
            margin: 1px 0.375rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .at-file:hover { background: var(--warm-sand); color: var(--near-black); }
        .at-file.active { background: var(--warm-sand); color: var(--near-black); font-weight: 500; }
        .at-file-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

        /* ====== Asset Browse Mode ====== */
        .at-browse { padding: 1.5rem 2rem; }
        .at-bc { display: flex; align-items: center; gap: 0.25rem; margin-bottom: 1.25rem; font-size: 0.8125rem; }
        .at-bc-sep { color: var(--stone); }
        .at-bc-item { color: var(--olive); cursor: pointer; padding: 0.125rem 0.25rem; border-radius: 4px; }
        .at-bc-item:hover { background: var(--warm-sand); color: var(--near-black); }
        .at-bc-item:last-child { color: var(--near-black); font-weight: 500; }
        .at-folder-card .card-thumb svg { opacity: 0.5; }

        /* ====== Asset Editor Mode ====== */
        .at-editor { display: flex; flex-direction: column; height: 100%; }
        .at-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border-cream);
            background: var(--dark-surface);
            flex-shrink: 0;
            gap: 1rem;
        }
        .at-toolbar .at-bc { margin-bottom: 0; }
        .at-toolbar-actions { display: flex; gap: 0.375rem; flex-shrink: 0; }
        .at-btn {
            padding: 0.25rem 0.75rem;
            border: 1px solid var(--border-warm);
            border-radius: 7px;
            background: var(--ivory);
            color: var(--charcoal);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.12s;
        }
        .at-btn:hover { border-color: var(--ring-warm); background: var(--warm-sand); }
        .at-btn-primary { background: var(--terracotta); color: #faf9f5; border-color: var(--terracotta); }
        .at-btn-primary:hover { opacity: 0.85; }

        .at-editor-body { display: flex; flex: 1; overflow: hidden; }
        .at-stage {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(260px, 1fr) auto;
        }
        .at-canvas-area {
            position: relative;
            overflow: hidden;
            background: var(--warm-sand);
            min-height: 260px;
        }
        .at-canvas-area canvas { position: absolute; top: 0; left: 0; }
        .at-zoom {
            position: absolute;
            bottom: 6px;
            left: 6px;
            font-size: 0.6875rem;
            color: var(--stone);
            background: rgba(255,255,255,0.7);
            padding: 1px 7px;
            border-radius: 3px;
        }

        .at-rpanel {
            width: 220px;
            border-left: 1px solid var(--border-cream);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background: var(--dark-surface);
        }
        .at-rpanel-head {
            padding: 0.5rem 0.625rem;
            border-bottom: 1px solid var(--border-cream);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
            font-size: 0.75rem;
            color: var(--olive);
        }
        .at-rpanel-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border-warm) transparent;
        }
        .at-rpanel-body::-webkit-scrollbar { width: 8px; }
        .at-rpanel-body::-webkit-scrollbar-thumb { background: var(--border-warm); border-radius: 999px; }
        .at-rpanel-body::-webkit-scrollbar-track { background: transparent; }

        /* Sprite items in editor panel */
        .ae-sitem {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.625rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-cream);
        }
        .ae-sitem:hover { background: var(--warm-sand); }
        .ae-sitem.sel { background: rgba(201,100,66,0.08); outline: 1px solid var(--terracotta); outline-offset: -1px; }
        .ae-sthumb {
            width: 36px;
            height: 36px;
            background: var(--warm-sand);
            border: 1px solid var(--border-warm);
            border-radius: 4px;
            flex-shrink: 0;
            image-rendering: pixelated;
        }
        .ae-sinfo { flex: 1; min-width: 0; }
        .ae-sname { font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--charcoal); }
        .ae-sname input {
            background: var(--ivory);
            border: 1px solid var(--terracotta);
            color: var(--near-black);
            padding: 0 3px;
            border-radius: 3px;
            font-size: 0.75rem;
            width: 100%;
            outline: none;
        }
        .ae-sbox { font-size: 0.625rem; color: var(--stone); font-family: 'SFMono-Regular',Consolas,monospace; margin-top: 1px; }
        .ae-pivot-edit {
            display: flex;
            gap: 6px;
            margin-top: 5px;
        }
        .ae-pivot-edit label {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--stone);
            font-size: 0.625rem;
        }
        .ae-pivot-edit input {
            width: 54px;
            padding: 2px 4px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--cream);
            color: var(--charcoal);
            font: 0.6875rem 'SFMono-Regular',Consolas,monospace;
        }

        .at-anim-panel {
            flex-shrink: 0;
            border-top: 1px solid var(--border-cream);
            border-right: 1px solid var(--border-cream);
            background: var(--dark-surface);
            padding: 0.75rem 1rem;
            display: grid;
            grid-template-columns: 128px minmax(0, 1fr);
            grid-template-rows: auto auto;
            gap: 0.5rem 0.75rem;
            align-items: start;
        }
        .at-anim-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            grid-column: 2;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--olive);
            width: min(720px, 100%);
            justify-self: center;
        }
        .at-anim-play { padding: 1px 7px; font-size: 0.6875rem; }
        .at-anim-canvas {
            grid-row: 1 / span 2;
            width: 128px;
            height: 96px;
            border: 1px solid var(--border-warm);
            border-radius: 6px;
            background: var(--warm-sand);
            image-rendering: pixelated;
        }
        .at-anim-rail {
            position: relative;
            min-height: 62px;
            overflow: hidden;
            overflow-y: hidden;
            padding: 0.125rem 0;
            width: min(720px, 100%);
            justify-self: center;
        }
        .at-anim-rail-track {
            position: relative;
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(30px, 1fr);
            align-items: stretch;
            width: 100%;
            border: 1px solid var(--border-cream);
            border-radius: 6px;
            background: var(--parchment);
        }
        .at-anim-tick {
            position: relative;
            width: 100%;
            min-width: 0;
            height: 62px;
            padding: 6px 4px 10px;
            border: 0;
            border-right: 1px solid var(--border-cream);
            background: transparent;
            cursor: pointer;
        }
        .at-anim-tick:last-of-type { border-right: 0; }
        .at-anim-tick:hover, .at-anim-tick.active { background: var(--warm-sand); }
        .at-anim-tick.active {
            box-shadow: inset 0 0 0 1px rgba(217,119,87,0.34);
        }
        .at-anim-tick.active::after {
            content: '';
            position: absolute;
            left: 6px;
            right: 6px;
            bottom: 3px;
            height: 2px;
            border-radius: 999px;
            background: var(--terracotta);
        }
        .at-anim-tick canvas {
            width: 44px;
            height: 44px;
            image-rendering: pixelated;
        }
        .at-anim-pointer {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 2px;
            background: var(--terracotta);
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--terracotta) 35%, transparent);
            pointer-events: none;
            transform: translateX(-1px);
            z-index: 2;
        }
        .at-anim-pointer::before {
            content: '';
            position: absolute;
            left: 50%;
            top: -1px;
            width: 7px;
            height: 7px;
            background: var(--terracotta);
            transform: translateX(-50%) rotate(45deg);
        }
        .at-anim-empty {
            padding: 0.5rem;
            color: var(--stone);
            font-size: 0.625rem;
            font-style: normal;
        }

        /* ====== Objects Editor ====== */
        .obj-editor {
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--dark-surface);
        }
        .obj-toolbar {
            min-height: 58px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.625rem 1rem;
            border-bottom: 1px solid var(--border-cream);
        }
        .obj-eyebrow {
            color: var(--stone);
            font-size: 0.625rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.1;
        }
        .obj-title {
            color: var(--near-black);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            font-weight: 500;
            margin-top: 0.125rem;
        }
        .obj-path {
            max-width: 45%;
            color: var(--stone);
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.6875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .obj-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            min-width: 0;
        }
        .obj-dirty {
            color: var(--stone);
            font-size: 0.6875rem;
            font-family: 'SFMono-Regular', Consolas, monospace;
        }
        .obj-dirty.dirty { color: #b86a32; }
        .obj-dirty.invalid { color: #b34a3f; }
        .obj-tool-btn,
        .obj-save-btn {
            min-height: 28px;
            padding: 0 0.625rem;
            border-radius: 5px;
            border: 1px solid var(--border-warm);
            background: var(--dark-surface);
            color: var(--charcoal);
            font-size: 0.6875rem;
            cursor: pointer;
        }
        .obj-save-btn {
            border-color: #d97757;
            background: rgba(217,119,87,0.12);
        }
        .obj-tool-btn:disabled,
        .obj-save-btn:disabled {
            opacity: 0.38;
            cursor: default;
        }
        .obj-body {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(360px, 1fr) 300px;
            min-height: 0;
        }
        .obj-stage {
            display: grid;
            grid-template-rows: minmax(260px, 7fr) auto minmax(128px, 3fr);
            min-width: 0;
            min-height: 0;
        }
        .obj-canvas-wrap {
            position: relative;
            min-height: 0;
            min-height: 260px;
            overflow: hidden;
            border-right: 1px solid var(--border-cream);
        }
        .obj-canvas-wrap canvas {
            position: absolute;
            inset: 0;
        }
        .obj-legend {
            position: absolute;
            left: 0.75rem;
            bottom: 0.75rem;
            display: flex;

        .obj-anim-offset {

        .obj-section {

        .obj-title-swatch {

        }
        .obj-title-swatch-child {
            background: rgba(255,209,102,0.18);
            border: 1px solid #ffd166;
        }
        .obj-row {
            display: grid;
            grid-template-columns: minmax(128px, 1fr) minmax(72px, 96px);

            gap: 0.625rem;
            padding: 0.1875rem 0;

        }
        .obj-row span {
            color: var(--stone);

            overflow: hidden;
            text-overflow: ellipsis;

        }
        .obj-row strong {
            color: var(--charcoal);
            font-weight: 500;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.7rem;
        }
        .obj-input {
            min-width: 0;
            width: 100%;
            max-width: 96px;
            min-height: 26px;
            padding: 0.25rem 0.45rem;
            border: 1px solid var(--border-warm);
            border-radius: 4px;
            background: var(--dark-surface);
            color: var(--charcoal);
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.7rem;

        }

        .obj-clip-list {

            padding: 0.35rem 0.5rem;
            border: 1px solid var(--border-warm);
            border-radius: 5px;
            background: var(--dark-surface);
            color: var(--charcoal);

        }
        .obj-clip-btn:hover {
            border-color: rgba(217,119,87,0.65);
            background: rgba(217,119,87,0.05);
        }
        .obj-clip-btn.active {
            border-color: #d97757;
            background: rgba(217,119,87,0.12);
        }
        .obj-clip-btn span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.75rem;
        }
        .obj-clip-btn em {
            color: var(--stone);
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.625rem;
            font-style: normal;
        }
        .obj-child-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.375rem;

        }
        .obj-child-btn {
            width: 100%;
            min-height: 34px;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            align-items: center;
            gap: 0.125rem;
            padding: 0.4rem 0.5rem;
            border: 1px solid var(--border-warm);
            border-radius: 5px;

        .obj-child-btn.active {
            border-color: #e2a93a;

        }
        .obj-child-btn span,
        .obj-child-btn em {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .obj-child-btn span {
            font-size: 0.75rem;
        }
        .obj-child-btn em {

            font-family: 'SFMono-Regular', Consolas, monospace;

        .obj-child-detail {
            padding-top: 0.375rem;

        .obj-child-heading {

            font-weight: 600;

        .obj-json {

        .obj-config-row {
            display: grid;
            grid-template-columns: minmax(92px, 0.78fr) minmax(0, 1fr) 42px;
            align-items: center;

            padding: 0.25rem 0.45rem;

            color: var(--charcoal);
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.7rem;
            line-height: 1.25;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

        .obj-empty,

            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--stone);

            color: var(--near-black);
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1.25rem;
            max-width: 28rem;
        }
        .obj-empty-sub {
            margin-top: 0.375rem;
            font-size: 0.8125rem;
            max-width: 28rem;
        }
        .obj-empty-side {
            padding: 1rem 0.875rem;
            color: var(--stone);
            font-size: 0.8rem;
        }

        .sidebar-top {
            height: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0 0.5rem 0 0.875rem;
        }

        .sidebar-top-right {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-left: auto;
        }
        .layout.collapsed .sidebar-top-right { display: none; }

        .sidebar-label {
            font-size: 0.6875rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--stone);
            white-space: nowrap;
            overflow: hidden;
        }
        .layout.collapsed .sidebar-label { opacity: 0; }

        .collapse-btn {
            background: none;
            border: none;
            color: var(--stone);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.12s, background 0.12s;
        }
        .collapse-btn:hover { color: var(--charcoal); background: var(--warm-sand); }
        .collapse-btn svg { width: 15px; height: 15px; transition: transform 0.22s ease; }
        .layout.collapsed .collapse-btn svg { transform: rotate(180deg); }

        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.5rem 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border-warm) transparent;
        }
        .sidebar-body::-webkit-scrollbar { width: 8px; }
        .sidebar-body::-webkit-scrollbar-thumb { background: var(--border-warm); border-radius: 999px; }
        .sidebar-body::-webkit-scrollbar-track { background: transparent; }

        .sidebar-footer {
            flex-shrink: 0;
            border-top: 1px solid var(--border-warm);
            padding: 0.75rem 0.875rem;
            background: var(--dark-surface);
        }

            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.35rem;
            min-height: 34px;
        }

        .layout.collapsed .sidebar-footer { display: none; }

        .group-label {
            font-size: 0.625rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--stone);
            padding: 0.625rem 0.875rem 0.25rem;
            white-space: nowrap;
            overflow: hidden;
        }
        .layout.collapsed .group-label { opacity: 0; }

        .s-item {
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0.625rem 0.5rem 0.875rem;
            cursor: pointer;
            position: relative;
            transition: background 0.1s;
            min-width: 0;
            user-select: none;
            border-radius: 8px;
            margin: 1px 0.375rem;
        }
        .s-item:hover { background: var(--warm-sand); }
        .s-item.active { background: var(--warm-sand); }

        .s-main {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-width: 0;
        }

        .s-name {
            flex: 1;
            font-family: var(--session-font);
            font-size: 1.03rem;
            font-weight: 400;
            color: var(--olive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .s-item.active .s-name { color: var(--near-black); }

        .s-model {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--stone);
            flex-shrink: 0;
        }

        .s-ctx {
            font-size: 0.6rem;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: var(--stone);
            line-height: 1;
            flex-shrink: 0;
        }

        .s-ctx.crit { font-weight: 800; }

        .s-unread {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--focus-blue);
            flex-shrink: 0;
        }

        .s-more {
            flex-shrink: 0;
            background: none;
            border: none;
            color: var(--stone);
            cursor: pointer;
            padding: 0 0.25rem;
            border-radius: 4px;
            font-size: 1rem;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.1s, background 0.1s;
        }
        .s-item:hover .s-more, .s-item.active .s-more { opacity: 1; }
        .s-more:hover { background: var(--border-warm); color: var(--near-black); }

        /* Dropdown */
        .s-dropdown {
            position: fixed;
            background: var(--dark-surface);
            border: 1px solid var(--border-warm);
            border-radius: 8px;
            padding: 0.25rem;
            z-index: 500;
            min-width: 130px;
            box-shadow: rgba(0,0,0,0.10) 0 4px 20px;

            display: block;
            width: 100%;
            padding: 0.375rem 0.625rem;
            font-size: 0.8125rem;
            color: var(--charcoal);

            border: none;
            text-align: left;
            transition: background 0.1s;

        .s-drop-item.danger { color: var(--error); }
        .s-drop-item.danger:hover { background: rgba(181,51,51,0.08); }

        .layout.collapsed .s-name,
        .layout.collapsed .s-model,
        .layout.collapsed .s-more,
        .layout.collapsed .group-label { display: none; }
        .layout.collapsed .s-item { align-items: center; justify-content: center; padding: 0.5rem 0; margin: 0; border-radius: 0; }

        /* ====== Main panel ====== */
        .panel { display: flex; overflow: hidden; position: relative; }
        .panel-main {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .detail-header {
            display: none;
            position: absolute;
            top: 0.9rem;
            left: 1.25rem;
            right: 4.75rem;
            z-index: 5;
            align-items: center;
            pointer-events: none;
        }
        .detail-header.visible { display: flex; }

        .detail-title {
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--session-font);
            font-size: 1.08rem;
            line-height: 1.2;
            font-weight: 400;
            color: color-mix(in srgb, var(--near-black) 72%, var(--stone));
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            background: var(--dark-surface);
        }
        .panel-body.detail-active { padding-top: 3.1rem; }
        .panel-body::-webkit-scrollbar { width: 10px; }
        .panel-body::-webkit-scrollbar-thumb { background: var(--border-warm); border-radius: 999px; }
        .panel-body::-webkit-scrollbar-track { background: transparent; }

        .review-toggle {
            display: none;
            position: absolute;
            top: 0.75rem;
            right: 1rem;
            z-index: 22;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: 1px solid var(--border-warm);
            border-radius: 50%;
            background: var(--dark-surface);
            color: var(--stone);
            cursor: pointer;
            transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
        }
        .review-toggle:hover,
        .panel.review-open .review-toggle {
            border-color: var(--ring-warm);
            background: var(--warm-sand);
            color: var(--near-black);
        }
        .review-toggle svg { width: 14px; height: 14px; }
        .review-toggle span { display: none; }
        .panel.chats-view .review-toggle { display: flex; }

        .review-sidebar {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 18;
            width: min(390px, calc(100vw - var(--sidebar-w) - 20px));
            min-width: 320px;
            border-left: 1px solid var(--border-warm);
            background: color-mix(in srgb, var(--dark-surface) 96%, var(--warm-sand));
            transform: translateX(100%);
            transition: transform 0.18s ease;
            display: flex;
            flex-direction: column;
            box-shadow: rgba(0,0,0,0.12) -12px 0 30px;
        }
        .panel.review-open .review-sidebar {
            transform: translateX(0);
        }
        .review-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .review-head {
            height: 52px;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-warm);
        }
        .review-title {
            font-family: var(--session-font);
            font-size: 1rem;
            color: var(--near-black);
        }
        .review-close {
            border: 0;
            background: transparent;
            color: var(--stone);
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            padding: 0.25rem 0.4rem;
            border-radius: 6px;
        }
        .review-close:hover {
            color: var(--near-black);
            background: var(--warm-sand);
        }
        .review-body {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 0.9rem 1rem 1.25rem;
        }
        .review-body::-webkit-scrollbar { width: 10px; height: 10px; }
        .review-body::-webkit-scrollbar-thumb { background: var(--border-warm); border-radius: 999px; }
        .review-body::-webkit-scrollbar-track { background: transparent; }
        .review-dag {
            position: relative;
            min-height: 0;
        }
        .review-svg {
            display: block;
            width: 100%;
            overflow: visible;
        }
        .review-edge {
            fill: none;
            stroke: var(--border-warm);
            stroke-width: 1.4;
        }
        .review-node-box {
            width: 220px;
            min-height: 54px;
            display: block;
            border: 1px solid var(--border-warm);
            border-radius: 8px;
            background: var(--dark-surface);
            color: var(--near-black);
            padding: 0.54rem 0.62rem 0.48rem;
            overflow: hidden;
            text-align: left;
            cursor: pointer;
            box-shadow: rgba(0,0,0,0.05) 0 2px 10px;
            transition: background 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
            font: inherit;
        }
        .review-node-box:hover {
            background: var(--warm-sand);
            transform: translateY(-1px);
        }
        .review-node-box.missing,
        .review-node-box.no-preview {
            cursor: default;
        }
        .review-node-box:disabled {
            color: var(--near-black);
        }
        .review-node-box.missing:hover,
        .review-node-box.no-preview:hover {
            background: var(--dark-surface);
            transform: none;
        }
        .review-node-title {
            font-family: var(--session-font);
            font-size: 0.95rem;
            line-height: 1.18;
            color: var(--near-black);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .review-node-status {
            margin-top: 0.28rem;
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--stone);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .review-node-box.locked .review-node-status { color: var(--error); }
        .review-node-box.open .review-node-status { color: var(--green-light); }
        .review-node-box.unknown .review-node-status { color: var(--terracotta); }
        .review-node-meta {
            margin-top: 0.22rem;
            font-size: 0.75rem;
            color: var(--stone);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .review-empty,
        .review-error {
            color: var(--stone);
            font-size: 0.8rem;
            padding: 0.8rem;
            border: 1px dashed var(--border-warm);
            border-radius: 8px;
            background: var(--parchment);
        }

        /* ====== Prompt input ====== */
        .panel-input {
            flex-shrink: 0;
            padding: 0.75rem 2rem 1.25rem;
            background: var(--dark-surface);
        }

        .input-wrap {
            max-width: 780px;
            margin: 0 auto;
            width: 100%;
        }

        .input-card {
            background: var(--dark-surface);
            border: 1px solid var(--border-warm);
            border-radius: 16px;
            padding: 1rem 1rem 0.75rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: rgba(0,0,0,0.04) 0 2px 12px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .input-card:focus-within {
            border-color: var(--ring-warm);
            box-shadow: rgba(0,0,0,0.08) 0 4px 20px;
        }

        .pasted-images {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .pasted-thumb {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-warm);
            background: var(--bg);
        }
        .pasted-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .pasted-thumb .thumb-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 10px;
            line-height: 16px;
            text-align: center;
            padding: 0;
        }
        .pasted-thumb .thumb-remove:hover {
            background: rgba(0,0,0,0.8);
        }

        .prompt-textarea {
            resize: none;
            border: none;
            background: none;
            font-family: Georgia, serif;
            font-size: 0.9375rem;
            color: var(--near-black);
            outline: none;
            line-height: 1.6;
            min-height: 28px;
            max-height: 260px;
            overflow-y: auto;
            width: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .prompt-textarea::-webkit-scrollbar { display: none; }
        .prompt-textarea::placeholder { color: var(--stone); font-style: italic; }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .send-btn {
            flex-shrink: 0;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--terracotta);
            color: #faf9f5;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.12s;
        }
        .send-btn:hover { opacity: 0.85; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ====== Welcome ====== */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--stone);
            padding: 2rem;
        }
        .welcome h2 {
            font-family: Georgia, serif;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--olive);
            margin-bottom: 0.5rem;
        }
        .welcome p { font-size: 0.875rem; line-height: 1.7; }
        .welcome code {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.85em;
            background: var(--warm-sand);
            color: var(--charcoal);
            padding: 0.1em 0.4em;
            border-radius: 4px;
        }

        /* ====== Chat ====== */
        .chat {
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2rem 3rem;
            gap: 0;
            max-width: 780px;
            margin: 0 auto;
            width: 100%;
        }

        /* User bubble */
        .cm-user {
            display: flex;
            justify-content: flex-end;
            margin-top: 1.25rem;
            margin-bottom: 0.25rem;
            min-width: 0;
            -webkit-user-select: contain;
            user-select: contain;
        }

        .cm-user-inner {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            max-width: 72%;
            min-width: 0;
        }

        .cm-user-bubble {
            background: var(--user-bg);
            color: var(--user-fg);
            border-radius: 16px 16px 3px 16px;
            padding: 0.625rem 0.875rem;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 0.9375rem;
            line-height: 1.65;
            word-break: break-word;
            overflow-wrap: anywhere;
            max-width: 100%;
            box-sizing: border-box;
        }

        .cm-time {
            font-size: 0.625rem;
            color: var(--stone);
            margin-top: 0.25rem;
            padding: 0 0.125rem;
        }

        /* Assistant turn */
        .cm-assistant {
            display: flex;
            justify-content: flex-start;
            margin-top: 1.75rem;
            margin-bottom: 0.5rem;
            -webkit-user-select: contain;
            user-select: contain;
        }

        .cm-assistant-inner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            min-width: 0;
        }

        .cm-message-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 100%;
            min-width: 0;
        }

        .cm-assistant-inner .cm-message-stack {
            width: 100%;
        }

        .cm-message-stack-user {
            align-items: flex-end;
            width: 100%;
            max-width: 100%;
        }

        .cm-actions {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.42rem;
            color: var(--stone);
            opacity: 0.58;
            transition: opacity 0.12s ease, color 0.12s ease;
        }

        .cm-assistant:hover .cm-actions,
        .cm-user:hover .cm-actions,
        .cm-actions:focus-within {
            opacity: 0.95;
        }

        .cm-copy-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 5px;
            background: transparent;
            color: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: background 0.12s ease, color 0.12s ease, transform 0.12s ease;
        }
        .cm-copy-btn svg {
            width: 16px;
            height: 16px;
            pointer-events: none;
        }
        .cm-copy-btn:hover {
            background: rgba(255,255,255,0.08);
            color: var(--near-black);
        }
        .cm-copy-btn:active { transform: translateY(1px); }
        .cm-copy-btn:focus-visible {
            outline: 2px solid var(--focus-blue);
            outline-offset: 2px;
        }
        .cm-copy-btn.copied { color: var(--green-light); }

.cm-assistant-bubble {
            background: none;
            border: none;
            border-radius: 0;
            padding: 0;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 1rem;
            line-height: 1.75;
            color: var(--user-fg);
            word-break: break-word;
            width: 100%;
        }

        /* ====== Markdown rendering ====== */
        .md-h1, .md-h2, .md-h3, .md-h4, .md-h5, .md-h6 {
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 500;
            color: var(--near-black);
            margin: 1em 0 0.3em;
            line-height: 1.3;
        }
        .md-h1 { font-size: 1.05rem; }
        .md-h2 { font-size: 0.975rem; }
        .md-h3 { font-size: 0.9rem; }
        .md-h4 { font-size: 0.84rem; font-weight: 600; }
        .md-h5, .md-h6 { font-size: 0.8rem; font-weight: 600; }
        .cm-assistant-bubble .md-h1:first-child,
        .cm-assistant-bubble .md-h2:first-child,
        .cm-assistant-bubble .md-h3:first-child,
        .cm-assistant-bubble .md-h4:first-child,
        .cm-assistant-bubble .md-h5:first-child,
        .cm-assistant-bubble .md-h6:first-child { margin-top: 0; }

        .cm-assistant-bubble .md-h1,
        .cm-assistant-bubble .md-h2,
        .cm-assistant-bubble .md-h3,
        .cm-assistant-bubble .md-h4,
        .cm-assistant-bubble .md-h5,
        .cm-assistant-bubble .md-h6 {
            color: var(--charcoal);
        }

        .cm-assistant-bubble ul,
        .cm-assistant-bubble ol,
        .cm-user-bubble ul,
        .cm-user-bubble ol {
            padding-left: 1.375rem;
            margin: 0.3rem 0;
        }
        .cm-assistant-bubble li,
        .cm-user-bubble li { margin: 0.15rem 0; }

        .md-pre {
            position: relative;
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 7px;
            padding: 0.625rem 0.875rem;
            margin: 0.5rem 0;
            overflow: hidden;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.8rem;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--border-warm) transparent;
        }
        .md-pre code {
            display: block;
            padding-right: 2.5rem;
            max-width: 100%;
            min-width: 0;
            min-height: 1.55em;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--border-warm) transparent;
        }
        .md-pre code::-webkit-scrollbar { width: 5px; height: 5px; }
        .md-pre code::-webkit-scrollbar-thumb { background: var(--border-warm); border-radius: 3px; }
        .md-pre::-webkit-scrollbar { width: 5px; height: 5px; }
        .md-pre::-webkit-scrollbar-thumb { background: var(--border-warm); border-radius: 3px; }
        .cm-user-bubble .md-pre { background: var(--code-bg); }
        .md-code-copy-btn {
            position: absolute;
            top: 0.45rem;
            right: 0.45rem;
            z-index: 1;
            color: var(--stone);
            background: var(--code-action-bg);
        }
        .md-code-copy-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .md-code {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            padding: 0.1em 0.38em;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.82em;
        }
        .md-math-inline {
            display: inline-block;
            margin: 0 0.08em;
            padding: 0 0.18em;
            border-radius: 4px;
            color: var(--near-black);
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            white-space: nowrap;
        }
        .md-math-block {
            display: block;
            margin: 0.55rem 0;
            padding: 0.55rem 0.75rem;
            border: 1px solid var(--border-cream);
            border-radius: 7px;
            background: rgba(255,255,255,0.08);
            color: var(--near-black);
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            text-align: center;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cm-user-bubble .md-code { background: rgba(255,255,255,0.18); }
        .md-file-link,
        .md-external-link {
            color: var(--terracotta);
            text-decoration: underline;
            text-decoration-color: rgba(217,119,87,0.4);
            text-underline-offset: 0.14em;
            cursor: pointer;
        }
        .md-file-link:hover,
        .md-external-link:hover {
            color: var(--olive);
            text-decoration-color: rgba(106,120,74,0.45);
        }
        .md-image-preview {
            display: block;
            max-width: min(100%, 520px);
            margin: 0.6rem 0;
            vertical-align: top;
            border: 1px solid var(--border-warm);
            border-radius: 8px;
            background: var(--cream);
            overflow: hidden;
        }
        .md-image-preview-link {
            display: block;
            background: var(--warm-sand);
            cursor: zoom-in;
        }
        .md-image-preview-link:hover {
            filter: brightness(1.04);
        }
        .md-image-preview img {
            display: block;
            max-width: 100%;
            max-height: 280px;
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .md-image-preview figcaption {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.58rem 0.78rem 0.72rem;
            border-top: 1px solid var(--border-warm);
            background: var(--cream);
            color: var(--stone);
            font-size: 0.78rem;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }
        .md-image-preview-title {
            font-weight: 650;
            color: var(--near-black);
        }
        .md-image-preview-path {
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-size: 0.72rem;
            color: var(--stone);
        }
        .md-image-preview.load-failed .md-image-preview-link {
            display: none;
        }

        .md-table {
            border-collapse: collapse;
            margin: 0.5rem 0;
            font-size: 0.875rem;
            width: auto;
        }
        .md-table th, .md-table td {
            border: 1px solid var(--border-warm);
            padding: 0.35rem 0.75rem;
            text-align: left;
        }
        .md-table th {
            background: rgba(255,255,255,0.05);
            font-weight: 600;
        }

        /* Tool group (series of tool chips) */
        .cm-tools {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.05rem;
            margin: 0.95rem 0 0.35rem;
        }

        .cm-tool-chip {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            align-items: baseline;
            column-gap: 0.65rem;
            width: min(100%, 680px);
            font-size: 0.86rem;
            line-height: 1.55;
            color: var(--stone);
            background: transparent;
            border: 0;
            padding: 0.04rem 0;
            border-radius: 4px;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.12s ease, opacity 0.12s ease;
        }

        .cm-tool-chip[onclick] {
            cursor: pointer;
        }
        .cm-tool-chip:hover {
            color: var(--olive);
            opacity: 0.86;
        }

        .cm-tool-chip.error {
            background: transparent;
            color: var(--error);
        }

        .cm-tool-chip.interrupted {
            color: var(--terracotta);
        }

        .cm-tool-chip.muted {
            color: var(--stone);
            opacity: 0.62;
        }

        .tool-name {
            font-weight: 700;
            color: var(--near-black);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .cm-tool-chip.error .tool-name { color: var(--error); }
        .cm-tool-chip.interrupted .tool-name { color: var(--terracotta); }
        .cm-tool-chip.muted .tool-name { color: var(--stone); }

        .tool-arg {
            color: var(--stone);
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        /* System / lifecycle labels */
        .cm-sys {
            display: flex;
            justify-content: center;
            margin: 0.75rem 0 0;
        }

        .cm-sys-label {
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--stone);
            opacity: 0.6;
        }

        /* ====== Buttons ====== */
        .btn {
            font-size: 0.8125rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            border-radius: 7px;
            padding: 0.375rem 0.75rem;
            transition: box-shadow 0.12s, opacity 0.12s;
            white-space: nowrap;
        }
        .btn-brand {
            background: var(--terracotta);
            color: #faf9f5;
            box-shadow: var(--terracotta) 0 0 0 0, var(--terracotta) 0 0 0 1px;
        }
        .btn-brand:hover { opacity: 0.87; }
        .btn-sand {
            background: var(--warm-sand);
            color: var(--charcoal);
            box-shadow: var(--warm-sand) 0 0 0 0, var(--ring-warm) 0 0 0 1px;
        }
        .btn-sand:hover { box-shadow: var(--warm-sand) 0 0 0 0, var(--charcoal) 0 0 0 1px; }
        .btn-ghost {
            background: none;
            color: var(--stone);
            border: 1px solid var(--border-warm);
            padding: 0.3125rem 0.625rem;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-ghost:hover { color: var(--near-black); border-color: var(--charcoal); }
        .btn-ghost.danger:hover { color: var(--error); border-color: var(--error); }

        /* ====== Conn dot ====== */
        .conn-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--terracotta);
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .conn-dot.live { background: var(--green-light); }
        .conn-dot.polling { background: var(--green); }

        /* ====== Dashboard shutdown ====== */
        .shutdown-btn {
            background: none;
            border: 1px solid var(--border-warm);
            border-radius: 7px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--stone);
            transition: border-color 0.12s, color 0.12s;
        }
        .shutdown-btn:hover { border-color: var(--error); color: var(--error); }
        .shutdown-btn svg { width: 15px; height: 15px; }

        /* ====== Theme toggle ====== */
        .theme-btn {
            background: none;
            border: 1px solid var(--border-warm);
            border-radius: 9px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--stone);
            transition: border-color 0.12s, color 0.12s;
        }
        .theme-btn:hover { border-color: var(--charcoal); color: var(--near-black); }
        .theme-btn svg {
            width: 15px;
            height: 15px;
        }
        .theme-icon-sun { display: none; }
        [data-theme="dark"] .theme-icon-moon { display: none; }
        [data-theme="dark"] .theme-icon-sun { display: block; }

        /* ====== Toast ====== */
        .toast {
            position: fixed;
            bottom: 1.25rem; right: 1.25rem;
            background: var(--dark-surface);
            color: var(--warm-silver);
            border-radius: 8px;
            padding: 0.625rem 0.875rem;
            font-size: 0.8125rem;
            z-index: 9999;
            animation: toastIn 0.18s ease-out;
            max-width: 280px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .toast.success { border-left: 3px solid var(--green-light); }
        .toast.error   { border-left: 3px solid var(--error); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ====== Session status modal ====== */
        .status-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            background: rgba(0,0,0,0.3);
        }
        .status-modal {
            background: var(--ivory);
            border: 1px solid var(--border-warm);
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            max-width: 720px;
            width: 90%;

        @keyframes cc-phase-spinner {
            0%, 16.66% { content: "*"; opacity: 0.74; transform: scale(1); text-shadow: none; }

            66.66%, 83.32% { content: "*"; opacity: 0.74; transform: scale(1); text-shadow: none; }
